:root{

  --bg:#000000;
  --ink:#ffffff;
  --ink-dim:#7a7a7a;
  --ink-line:#313131;
  --ink-bar:#101010;
  --ink-soft:#b0b0b0;

  --cv-bg:#06090b;
  --cv-ink:#cbd3c7;
  --cv-dim:#78857c;
  --cv-faint:#3d4842;
  --cv-line:#1c2421;
  --cv-red:#a8362b;

  --red:#a8362b;

  --font-sys:SimSun,"Songti SC","宋体","Noto Serif SC","Source Han Serif SC",STSong,serif;
  --font-file:"Times New Roman",KaiTi,"Kaiti SC",STKaiti,"楷体","Kaiti TC",SimSun,serif;
  --font-title:"JH-LT","京華老宋体","Noto Serif SC","Songti SC",SimSun,serif;

  --fs:17px;
  --lh:1.95;
  --fs-head:15px;

  --panel-fill:86;
  --panel-w:1800px;
  --panel-h:1100px;
  --head-h:44px;
  --bar-h:52px;
  --pad-x:18px;
  --pad-y:16px;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}

body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sys);
  font-size:var(--fs);line-height:var(--lh);font-weight:400;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body.cover-mode{background:var(--cv-bg)}
p{margin:0}
b,strong{font-weight:700}
::selection{background:var(--ink);color:var(--bg)}

#grain{
  position:fixed;left:0;top:0;width:100%;height:100%;
  image-rendering:pixelated;pointer-events:none;
  z-index:120;opacity:.045;
}

#cover{position:fixed;inset:0;z-index:40}

#sun{
  position:fixed;left:0;top:0;width:100%;height:100%;
  image-rendering:pixelated;pointer-events:none;
  opacity:0;transition:opacity 2.4s ease;
}
#sun.on{opacity:1}

.scan{
  position:fixed;inset:0;pointer-events:none;z-index:30;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  opacity:.9;
}
.vig{
  position:fixed;inset:0;pointer-events:none;z-index:31;
  background:radial-gradient(120% 100% at 50% 48%,transparent 34%,rgba(0,0,0,.8) 100%);
}

.horizon{
  position:fixed;left:0;right:0;height:1px;z-index:33;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cv-line) 15%,var(--cv-line) 85%,transparent);
}
.horizon::after{
  content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:min(44vw,620px);height:1px;background:var(--cv-red);opacity:.42;
}

.frame{position:fixed;inset:22px;pointer-events:none;z-index:34}
.frame i{position:absolute;width:16px;height:16px;border:1px solid var(--cv-line)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

.stage{
  position:fixed;left:0;right:0;top:0;height:56vh;z-index:34;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 6vw;
  opacity:0;transform:translateY(12px);
  transition:opacity 1.6s ease,transform 1.6s ease;
  will-change:opacity,transform;
}
.stage.on{opacity:1;transform:none}

.title{
  margin:0;font-family:var(--font-title);
  font-size:clamp(44px,10vw,128px);font-weight:400;line-height:1.06;
  letter-spacing:.14em;text-indent:.14em;color:var(--cv-ink);
  text-shadow:0 0 30px rgba(203,211,199,.16),0 0 90px rgba(6,9,11,.9);
}
.rule{
  width:clamp(120px,15vw,230px);height:1px;margin:2.1em 0 0;
  background:linear-gradient(90deg,transparent,var(--cv-line) 12%,var(--cv-faint) 50%,var(--cv-line) 88%,transparent);
}

.btn{
  position:fixed;left:50%;top:78vh;z-index:34;
  transform:translate(-50%,0) translateY(8px);
  display:inline-block;
  padding:13px 38px;
  border:1px solid var(--cv-faint);
  background:transparent;color:var(--cv-dim);
  font-family:var(--font-sys);
  font-size:14px;line-height:1;letter-spacing:.26em;text-indent:.26em;
  cursor:pointer;user-select:none;
  opacity:0;
  transition:opacity 1s ease,transform 1s ease,
             color .22s ease,background .22s ease,border-color .22s ease;
}
.btn.on{opacity:1;transform:translate(-50%,0) translateY(0)}
.btn:hover,.btn:focus-visible{color:var(--cv-bg);background:var(--cv-ink);border-color:var(--cv-ink);outline:none}
.btn:active{background:var(--cv-red);border-color:var(--cv-red);color:#f2ece4}

.glitch{animation:shake .5s steps(2) 1}
@keyframes shake{
  0%{transform:translate(0,0)}
  15%{transform:translate(-4px,2px)}
  32%{transform:translate(3px,-3px)}
  48%{transform:translate(-2px,1px)}
  66%{transform:translate(4px,2px)}
  84%{transform:translate(-3px,0)}
  100%{transform:translate(0,0)}
}
.glitch .title{
  text-shadow:3px 0 rgba(168,54,43,.85),-3px 0 rgba(88,130,142,.7),0 0 40px rgba(0,0,0,.9);
}
.down{opacity:0 !important;transition:opacity .6s ease}

#op{position:fixed;inset:0;z-index:60;background:#000;overflow:hidden}
.op-scene{position:absolute;inset:0;z-index:1;display:none}
.op-scene.is-on{display:block}
.op-say{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1.6em;padding:0 6vw;
}
.op-say p{
  margin:0;width:min(760px,88vw);
  padding-left:1.9em;text-indent:-1.9em;
  font-family:var(--font-file);
  font-size:clamp(15px,1.45vw,20px);
  line-height:1.95;letter-spacing:.05em;text-align:left;
  color:var(--ink);
  opacity:0;
}
.op-say p.is-on{opacity:1}
.op-say .sym{color:var(--ink-dim);margin-right:.7em;letter-spacing:0}

#boot{
  position:fixed;inset:0;z-index:80;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);opacity:0;transition:opacity .5s ease;
}
#boot.on{opacity:1}
.boot__inner{width:min(720px,82vw);font-size:var(--fs);line-height:2.5;letter-spacing:.03em}
.boot__inner p{opacity:0;transition:opacity .25s ease}
.boot__inner p.on{opacity:1}
.boot__inner p.dim{color:var(--ink-dim)}

#app{
  position:fixed;inset:0;z-index:90;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .5s ease;
}
#app.on{opacity:1}

.screen{
  width:min(var(--panel-w),calc(var(--panel-fill) * 1vw));
  height:min(var(--panel-h),calc(var(--panel-fill) * 1vh));
  height:min(var(--panel-h),calc(var(--panel-fill) * 1dvh));
  border:1px solid var(--ink-line);
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:
    "real think"
    "bar bar";
  overflow:hidden;
}

.col{
  display:grid;grid-template-rows:var(--head-h) minmax(0,1fr);
  min-height:0;min-width:0;position:relative;
}
.col--real{grid-area:real}
.col--think{grid-area:think;border-left:1px solid var(--ink-line)}

.col__head{
  height:var(--head-h);line-height:var(--head-h);
  padding:0 var(--pad-x);
  color:var(--ink-dim);
  border-bottom:1px solid var(--ink-line);
  font-family:var(--font-title);
  font-size:var(--fs-head);
  letter-spacing:.42em;text-indent:.42em;
  text-align:center;
}
.col.is-live .col__head{color:var(--ink)}

.stream{
  position:relative;min-height:0;
  overflow-x:hidden;overflow-y:auto;
  padding:var(--pad-y) var(--pad-x) 10px;
  overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#2a2a2a transparent;
}
.stream::-webkit-scrollbar{width:6px}
.stream::-webkit-scrollbar-track{background:transparent}
.stream::-webkit-scrollbar-thumb{background:#2a2a2a}

.round{margin:0 0 1.1em}
.round.folded{display:none}

.echo{
  display:flex;gap:8px;
  background:var(--ink-bar);
  margin:6px calc(-1 * var(--pad-x)) 10px;
  padding:2px var(--pad-x) 3px;
}
.echo__mark{color:var(--ink-dim)}
.echo__text{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}

.sys{color:var(--ink-dim);margin:.5em 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sys.ink{color:var(--ink)}
.sys.ask{color:var(--ink);margin:1.2em 0 .3em}

.hint{color:var(--ink-dim);margin:1.1em 0 .2em;padding-left:.9em;border-left:1px solid var(--ink-line)}

.mark{text-align:center;color:var(--ink-dim);margin:1.7em 0 .9em;letter-spacing:.06em}
.mark.end{margin:.9em 0 .2em}

.p{font-family:var(--font-file);padding-left:2em;margin:0 0 1.2em;overflow-wrap:anywhere}
.p.a{font-family:var(--font-sys);padding-left:0;margin:0 0 .9em}
.p strong{font-weight:700}
.p em{font-style:italic;color:var(--ink-dim)}

.row{display:block;color:var(--ink-dim);padding:0;cursor:pointer;transition:color .16s ease}
.row::after{content:'  ›';color:#3d3d3d}
.row:hover{color:var(--ink)}
.row.head{color:var(--ink-dim);cursor:default;margin-top:1.1em;letter-spacing:.06em}
.row.head::after{content:''}
.row.item{color:var(--ink)}
.row .dim{color:var(--ink-dim);margin-left:.6em;font-size:.9em}
.row .no{color:var(--ink-dim);font-size:.88em;margin-right:0}

.cmdrow{color:var(--ink);margin:.8em 0 0;line-height:1.55}
.cmdrow b{font-weight:700}
.cmddesc{color:var(--ink-dim);margin-top:-.1em;line-height:1.55}
.capmark{color:var(--ink);margin-right:.5em}

#app.reading .row.item{pointer-events:none;opacity:.4}
#app.reading .cmd{color:var(--ink-dim)}
#app.reading .bar{opacity:.55}

@keyframes fltflash{
  0%,100%{color:var(--ink-dim)}
  50%{color:var(--ink)}
}
.row.flt{color:var(--ink-dim);margin-top:.2em;animation:fltflash 1.15s ease-in-out 3}
.row.flt:hover{color:var(--ink)}
.flt-opts{margin:0 0 .4em;display:flex;flex-wrap:wrap;gap:.9em;color:var(--ink-dim);font-size:.92em}
.flt-opts[hidden]{display:none}
.flt-opt{cursor:pointer;color:var(--ink-dim)}
.flt-opt:hover{color:var(--ink)}
.flt-opt.on{color:var(--ink)}

.row.item.is-down{color:var(--ink-dim)}

.fold{color:var(--ink-dim);cursor:pointer;margin:0 0 1em;user-select:none}
.fold:hover{color:var(--ink-soft)}
.fold::before{content:'··· ';color:#3d3d3d}

.cue{color:var(--ink-dim);text-align:center;margin:.2em 0 .6em;font-size:12px;letter-spacing:.2em;user-select:none}

.bar{
  grid-area:bar;
  border-top:1px solid var(--ink-line);
  display:flex;align-items:center;gap:8px;
  height:var(--bar-h);padding:0 var(--pad-x);
}
.prompt{color:var(--ink-dim);flex:none}
.field{position:relative;flex:1 1 auto;height:100%;display:flex;align-items:center;min-width:0}
.cmd{
  width:100%;height:100%;
  background:transparent;border:0;outline:0;
  color:var(--ink);font-family:var(--font-file);font-size:var(--fs);letter-spacing:.02em;
  caret-color:transparent;padding:0;
}
.mirror{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  white-space:pre;visibility:hidden;
  font-family:var(--font-file);font-size:var(--fs);letter-spacing:.02em;
}
.caret{
  position:absolute;top:50%;transform:translateY(-50%);
  width:9px;height:1.1em;background:var(--ink);
  animation:blink 1.06s steps(1,end) infinite;pointer-events:none;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

@media (max-width:820px){
  .screen{
    width:100vw;height:100vh;max-width:none;max-height:none;border:0;
    grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto;
    grid-template-areas:"real" "think" "bar";
  }
  .col--think{border-left:0;border-top:1px solid var(--ink-line)}
}

@media (prefers-reduced-motion: reduce){
  .caret,.title,.stage,.btn,#sun,#app,#boot{transition:none;animation:none}
}

<script>
var DATA = [{"id":"00-☆","no":"00","sym":"☆","key":"结局","kind":"mem","view":"范泽","paras":["寂静的、空无一物的。","无法为语言所描述的虚无。","你的意识游荡于无垠虚无之中。","","只是存在就耗尽了你的全部力气。","你缘何于此徘徊？","","**母亲**。","你记起来了。","","你是为了母亲，才离开禾港、回到宜州的。","","除此以外呢？","","你的名字是什么？**你是☆**。","你的躯体在哪儿？**在水中沉眠**。","","人类的记忆依赖于大脑。所以，失去躯体意味着失去记忆。作为补偿，**你可以检索他人的记忆**。思维系统赋予你无限的时间，去探索有限的记忆。部分记忆被归类为公共记忆，无需解锁。你的调查将围绕以下问题：","","0. 你是谁？","1. 是谁杀了你？","","现在，请键入指令。"],"chars":252,"docx":"00-☆-结局.docx"},{"id":"01-○","no":"01","sym":"○","key":"母亲","kind":"mem","view":"薛怜","paras":["母亲是一架古朴的小提琴。","","多么漂亮的琴弓啊。银白色的琴弓搭上琴颈，缓慢而决绝地游弋、游弋、游弋。琴身流淌出明快新鲜的乐曲。她是为了什么而存在？也许就是为这一曲秾丽的终章。她是多么沉醉啊。她不需要任何听众，她尽情燃烧自己，因她自认无罪。","","是一首简洁的曲目。","","乐章结束，小提琴退场了。","","天井里只剩一具尸体，以及沉默的你。在短短几天内，母亲的故事传遍了整个小洼村。他们都说，母亲是个烈性的人，因为一点小事就想不开，抛下男人孩子，大白天里抹了脖子。大约她有精神病。外地女人总爱犯精神病。幸好已经生了孩子。","","你对这类话题没有兴趣。你只是在想小提琴。你对它的认识分为两部分：日历画报上的图片，以及收音机里的《梁祝》。你想摸一摸真正的小提琴。它的琴身是凉还是热？它的弓弦是软还是硬？一把西洋的小提琴，包含了你对幸福的所有幻想。","","左旭升比你大七八岁，前年初中毕业。他的出现恰到好处。","","“你要上县城吗？我们缺个小小子。”","","“要去。我要去看小提琴。怎么去？你有木兰吗？”","","“不骑木兰。我们坐车去。”","","在召亭，劫车是件很简单的事。只需要四步：首先，队伍里得有闺女或小小子（女人或小孩）；其次，派闺女或小小子去拦路搭车；其三，只要有轿车停下，就拦在车头处，不准车辆再起步；其四，派一个青年持刀钻进车里，去跟司机打商量。","","你们有三个青年。司机审时度势，大度地弃车逃跑了。你们顺利抵达了召亭县城。在之后的人生中，你还会来这儿无数次。对于召亭，你谈不上喜欢。城市的本质是人类的大型聚居地，它的核心是人。你无法发自内心去爱上任何一个召亭人，自然也无法爱上召亭。","","召亭没有可爱之人。","","可爱意味着软弱，软弱意味着死亡。","","母亲就是一架可爱的小提琴。你爱过她吗？你早就不记得了。倘若让你列一个母亲名单，或许你会把召亭的江云排在第一名。她也是个外地女人。她也是别人口中的精神病。她也是……不，她不是小提琴。她什么都不是。她就是江云。她就是她自己。"],"chars":788,"docx":"01-○-母亲.docx"},{"id":"02-○","no":"02","sym":"○","key":"江云","kind":"mem","view":"薛怜","paras":["你去找江云。她正蹲在天井里抽烟。见你走近，她眯眼笑了笑，朝你吐一口烟。她所吐出的烟圈，总是圆满的。一口烟分四五次吐出来，涟漪般荡开、牵连在半空又层层消散。","","你由此联想到鱼——她是岸上的鱼，对着空气吐泡泡。","","……说得通。毕竟人类是从鱼类进化来的。走出海洋。走向……走向宇宙。宇宙。宇宙飞船。太空。太空竞赛。冷战。美苏。苏联已经解体了……所以是美国。美国。美国轰炸南联盟大使馆。南联盟。南斯拉夫。南斯拉夫一分为五……为什么？也许因为苏联解体？——怎么又回到苏联了？还是从太空开始。太空。载人航天。神五发射成功……","","“小花啊，你去过写字楼吗？”","","她朝你招了招手。你走近蹲在她身边。她正用手指蘸着积水，在石砖上抹出深色的简笔画。","","“没去过？你得好好学习。你得去写字楼……有包膜的真皮沙发、会转的扶手椅，抽屉里全是**红的**……全是红的！他妈的！”","","她深深吸一口烟，仿佛被自己的想象惹恼了。","","人无法想象出认知之外的事物。","","你没去过写字楼。但你并不认为写字楼的沙发需要包膜。沙发包膜的目的是，在肮脏的卫生环境中，通过塑料薄膜或廉价布料保护沙发面，延长沙发的使用寿命。写字楼会很干净。它会雇佣外来人员定期打扫、它会付钱给清洁员。清洁员一定比乡下女人更擅长打扫房间，他们是为了薪水而工作。薪水是一种正向反馈，而家庭责任感是一种逆向反馈。逆向反馈需要排解。倘若无法排解，就只有逃避。于是母亲离开了……为什么会想到这个？这毫不相干。","","你最近总在走神。自打上了高中，左旭升总说你变痴了。李胜利倒是很支持你念书。他是对的，念书是有好处的。你是全街道唯一一位辨认出高锰酸钾的高材生，击穿了“紫药水”的神圣性。这种消毒剂尤其在街孩子中流行，连江云也受过骗，上千块只买来一小瓶。","","批判的武器不能替代武器的批判。为了证明自己的理论，你亲自上门，将那位江湖游医的店面砸得粉碎，以拳头和匕首捍卫了真理：","","“再让我见你一次，你就他妈的死定了！”","","此事发生在光天化日的大街上。在路人眼中，这是一起街孩子的持刀行凶。你的恶名因而更加显赫。江云事后攥住你的手，热切地检查你的身体。确认你没有受伤，她才笑嘻嘻地抱住你，拢手捏你的脸：“我们小花这么聪明，以后肯定是大学生！”","","石砖上的水渍干得很快。新一笔刚画完，旧一笔就消了。你已经过了爱画画的年纪了。江云抬手，将你的额发敛至耳后，方便她打量你的脸。你的头发已经很长了，几乎落在肩上。","","说起来，左旭升去年也留过长发，被他母亲看不惯，趁他睡觉时剪掉了。幸好你没有母亲。","","你摩挲着石砖的接缝处：“我不想上学了。”","","“怎么就不念了？今年春天不是还考了第一名嘛。我就是当年没学上，现在才瞎混。你得上学。上了学，你就成才了。”","","“我没钱。”","","“让你爹借钱嘛。”","","“我爹好几年没回来了。”","","“你家里还有谁？”","","“没谁了。我爷爷今年也走了。”","","“……那你也得上学嘛。这么一点点出去打工，别人不要你的。我现在是没钱，还得养两个小的。要是我有钱，我准保供应你。”","","好吧，不要再自我欺骗了。其实你本意是来借钱的。你疯了。你怎么会想跟江云借钱？她穷得险些去卖血，是你好说歹说，才把她劝住的。你用艾滋病的惨状将她吓住了。卖血不是做婊子，前者或许能戴上保险套，后者拿针管直接插进你的皮肉里……要是你能混成血头就好了，你会比其他血头更仁慈，不用20%，你只做5%的抽水……据说杨天一也做过血头，后来犯了事，才躲回乡下……他妈的，都是他害得李胜利被抓！","","你不能再思考了，你几乎被自己的思绪惹火了。","","空想。空想是毫无意义的。不是有个简单的方法吗？","","行动、行动起来！","","你起身离开了天井。"],"chars":1451,"docx":"02-○-江云.docx"},{"id":"03-※","no":"03","sym":"※","key":"李胜利","kind":"mem","view":"李珀涯","paras":["在你七岁这一年，发生了两件大事和三件小事。","","大事其一，你被送到县城念小学，并拥有了“学名”。你的学名没有恶意，只是太过敷衍，就如同父母对你的期盼。他们无所期盼。你对学校也同样无所期盼。同龄人的吵闹让你无所适从，你无法加入任何人的话题。","","大事其二，你结识了李光辉。李光辉崭新出厂，尚不能流利地与人交谈。寡言的你与他相见甚欢，二人迅速发明出一套前无古人的手语。这门手语的存世时长只有八个月，因李光辉掌握口语而宣告消亡。","","你从不认为李光辉比你聪明。","","他只是天然擅长“大大方方”的做派，对世界展现出不计后果的自信与不惧牺牲的热情。名字会塑造一个人。因为是天生的光辉，就被潜移默化地被培养成世界的中心。而你……你是他的小小注脚，是光辉下的阴翳：“你们家光辉真够机灵，以后肯定不愁进社会。小小嘛……也挺懂事的。”","","你对外部评价并不在意。也许有1%的在意。在这一尺度下，李光辉至少有99%。毕竟品尝过被人捧在掌心赞美的滋味，飘飘欲仙也是可以理解的。","","过分在意他人的评价，就会成为他人的玩具。你越对李光辉冷淡无视，他就越对你恭敬有加，殷切地期待着你能给予他高度评价。你发现人和狗其实是一样的。被夸就会摇尾巴，挨骂就会躲起来难过。你自认为窥见了世界真理，从此不再和狗群来往，最大的爱好是逛店，只看不买；次大的爱好是，幻想自己在异世界只手遮天。","","至于其他小事，可以概括为三句话。召亭辛家埠发生了一起恶性杀人案；江恒生把母亲的钱全部卷走后下落不明；李胜利因病死亡。","","为了赶在春节前办完白事，李胜利被草草烧成灰，埋进县城的社区墓地。召亭的冬天向来干冷，李光辉闹着要回家，左旭升把他抱起来哄了又哄，还是无果。直到薛怜过来训了他两句，他才闭上嘴巴、不敢再哭。","","这就是你的七岁。"],"chars":715,"docx":"03-※-李胜利.docx"},{"id":"04-○","no":"04","sym":"○","key":"江恒生","kind":"mem","view":"薛怜","paras":["早年流行过一种都市传说。大致情节是，一位青年因某原因被诱骗到酒店，醒来后发现自己在填满冰块的浴缸中，两侧肾脏全然被割走，只留下两道狭长猩红的缝合疤痕。","","在召亭县的孩子圈里，这类怪谈有另一个版本。主角不是被诱拐到酒店，而是被漂亮的小女孩叫到土坡下。只要连应三声，就会失去意识，醒来时五脏皆空，只余空荡荡人皮漂泊世间，魂魄凄凄地唤：“我的心肝啊……我的心！”","","在这类故事里，漂亮的小女孩才是重心。漂亮、女、小孩，都是相对无害的元素，甚至常作为被迫害的对象。以这类元素引出灾难化结局，大约隐含了召亭人对社会环境的强烈不安——如果对小孩都不能放松警惕，我们还能信任什么？","","左旭升每每听说这类故事，就要闭上眼睛，左手抬起来、手指朝天甩三下。没有任何证据表明，这种仪式能驱散霉运，然而他坚信不疑。","","你认为这是出于恐惧。","","恐惧感的来源很简单。在你们处理魏娟时，放风的左旭升坚称自己见到了一个小女孩。一个梳着双马尾的女孩，在路对面闪了两下，消失在苞米地里。他们离得很近……非常近。左旭升认为自己看清了她的脸，但无法用语言描述出来。","","这就是不读书的下场。如果目击者的是你，你一定能准确描述她的容貌特征，并以最高效的手段找到她，除非——","","“你肯定是看错了，哪有小孩三更半夜在外面晃的？”","","江恒生给出了自己的解法。质疑是带有攻击性的逃避，你对此不敢苟同，但也表示宽宥。你羡慕他的愚蠢，也佩服他的低劣。如果换做你，一定无法说服自己卷钱跑路，以自己的前半生为代价，去赌一个陌生的远方。","","然而江恒生毫无心理负担地做到了。","","李胜利病得太厉害，致使你无暇抓他回来。尽管你并未告诉李胜利这个消息，但他大概率早已猜到。在生命的最后一个月，他再没问起过江恒生。","","“你别在这……你回去念书吧。”","","意识清醒时，李胜利总会催你走。","","作为四人里唯一的高中生，你对学校深恶痛绝。你承认知识是神圣的，你如饥似渴地阅读一切可阅读的文字，这并不代表学校就同样神圣。","","一切都是双重思想，试卷上写一套，现实里做一套。","","一切都是双重思想。县大队的干部扇你一巴掌，你就怯怯地点头，说你不记得李胜利中途有没有离过场。你们四个打了一晚上扑克，你连自己每局摸了什么牌都清楚记得。学校不会教你如何应对县大队的干部，他们都说你邪性，但你还是屈服了，跟其他人没什么区别。一切都是双重思想。","","学校没有教给你任何事，如果你曾蒙受过知识的馈赠，那仅仅是出于你个人强烈的求知欲。","","乡下的老师在学校教了一辈子，除了老师就只做过省城的学生。他们跟县大队的干部没有本质区别。","","你总有无数个请假理由，而且永远有新的理由。","","你说今天上不了学，因为几个街孩子在校门口蹲着，人一到就弄死你；你说今天上不了学，因为你要去派出所受审，警察威胁要把你抓进少管所；你说今天上不了学，因为你没钱了，你得去国道上搞点学费；你说你今天上不了学，因为你他妈的被人扔进河里了，你得在淹死之前爬回堤上；你说你今天上不了学，因为你碰上劫客车的，你得等他们抢完了下车走远，你再慢慢从镇上走回来。","","他们起先抚掌大笑，后来就不笑了。","","学校没有教会你任何事。整个念书生涯，不断有同学拿你的学名取乐，这类取乐往往是暴力性的，因为弱者是一种处境，弱者的一切都是弱者的证明。江云可以叫你小花，不代表人人都能这么叫。一个人被强制丢进封闭的、上百人的集体，这就叫坐牢。你们煞费苦心，终于没让李胜利到省城去坐牢。","","现在他要你回去坐牢了，尽管你身无分文。","","“你回去念书吧。等你考上大学，就不用回来了。”","","左旭升也破天荒地劝你。那时还没有旭凌公司。后来你读大学时，写信帮他取了这个名字。你的本名放在后面，仿佛你也参与了这份事业。这只是个小玩笑，谁知道他真会采纳？谁又知道旭凌会成为正儿八经的上市公司？谁又知道……宜州会变成这副样子？","","你一定会再回来的。","","**你发誓要回来改变这一切。**","","也许自那时开始，你已经与左旭升分道扬镳了。"],"chars":1567,"docx":"04-○-江恒生.docx"},{"id":"05-△","no":"05","sym":"△","key":"何晓轶","kind":"mem","view":"何晓轶","paras":["血流了出来。","","11岁那年，你开始流血。待你察觉时，已经染透了裤子，在县小的木凳上、洇出一抹薄薄的铁锈色。若干年前，县小的厕所还没有隔间。挨到放学，同学几乎走空了，你终于躲进厕所、关上门，仔细研究起浸透了褐渍的内裤。是粘稠的、肮脏的锈红色。","","你蹲下去。","","又站起来。","","又蹲下去。","","大腿内侧淌下两道棕红色的痕迹。你盯着那团渍。小腹开始坠坠地疼。一只手从下方伸进去，攫住某个陌生的器官，拧一圈、停一圈，再拧一圈。你被拧的腰酸，似乎整个人都要往下掉，掉进厕所的瓷砖缝里，被84消毒水的气味腐蚀成全然的血水，按下冲水键就能彻底消失。","","你想，自己大约得了某种绝症。若不是恶病，血怎么会流出来？……还是这样难堪的脏血。你宁愿给自己来一刀，至少流出的是鲜红，伤口也能展示给同学，当作课间的笑料。你用指甲刮了刮。棉内裤上覆着深褐色的粘液，被你的手指刮下来、堆在指甲缝里。你联想到外公生前咳出的血痰，也是这样滑腻又恶心。","","你又想起上个月杀的鲫鱼。锃亮的刀伸进去，剖出一摊腥红的脏器，血淋淋地堆在砧板上。鱼的眼睛还睁着。听说鱼没有睑，闭不上眼睛，它只能盯着血水顺着台面淌下去，眼睁睁地凝视着死亡。属于它自己的死亡。后来妈把你从厨房赶走了。妈嫌你干活不利落，杀个鱼都要磨唧半天，净耍大小姐脾气。","","你伸出十指给妈看，坚决拒绝娇气的指控。光是刮鳞就在手指上留了七八个口子，背鳍的刺扎在指甲里，瘀血积在甲床下，将整片指甲染成深红色。指甲的伤口在惯用手，之后的几个月里，你疼得写不了字，只好强迫自己当个左撇子，作业写得歪歪扭扭，先后被两科老师叫进办公室，批评你的学习态度。","","妈看了看你的手。妈说，这有什么？哪个女人不是这样过来的，厨房里的事都担不起，将来到了婆婆家，谁还能看得起你。","","于是你再不讲了。","","指甲的事你都讲不出口。","","这样腌臜的事，你更是讲不出了。妈会怎么说你？说你自己不注意，吃错了东西？或者卫生不检点，下面钻进了虫子？倘若是恶病，一定要花许多钱。父母以前总夸你健康，说你省心好养活，从小不生大病，感冒也是睡一觉就好。倘若你得了病，妈又少了件可以炫耀的谈资，火气还是要落回你身上。","","你不再想了。你深吸一口气，穿上裤子，安慰自己无事发生。你得回家了。倘若回去更晚，妈又要疑心你交了不三不四的朋友，去了不三不四的地方。回家的路上，几个乞丐在路口磕头，口中念念有词。你停住打量了几眼，就把流血的事儿忘了，也把回家洗裤子的事忘了。","","晚间你趴在茶几上写作业，裤子上的血蹭脏了沙发。妈将你揪起来，嫌你腌臜。妈说，沙发套子是今年才洗过的，不当家的人根本不知道，绒套子从来最难洗，洗完又要晾上四五天才干。","","手指绞弄校服的衣襟，你也觉得自己腌臜。可又怎么办呢——血怎么就流出来了呢？若是你得病死了，家里岂不是白养你十几年。可是血怎么就流出来了呢？这难道也是你的错吗？","","妈说，你这就是来好事了，你得自己记着日子。","","这事儿好在哪儿呢？你心里不忿，但你说不出口。对着父母，你什么都说不出口了。妈说，女人都是这样过来的，一个月有那么几天。你小小孩子，以后要经的事还多呢，这算点什么。再者，以后你就是大姑娘了，得有点大姑娘的样子。","","你是大姑娘啦，得处处精细；你是大姑娘啦，要学着端庄；你是大姑娘啦……","","妈絮絮叨叨走开去，迎面与父亲撞上，又开始了新一轮絮叨。市南过几年就要拆迁了。要是没了房子，你们只能回召亭县城。这才是天大的事呢。相较之下，你的好事又算得了什么？","","于是你再不讲话了。","","你再不讲话。"],"chars":1401,"docx":"05-△-何晓轶.docx"},{"id":"06-※","no":"06","sym":"※","key":"薛怜","kind":"mem","view":"李珀涯","paras":["在母亲的描述中，薛怜就好比周处，年轻时为祸一方，经历一番波折后回心转性重回正道——你认识他的时候，他已经是省城的检察官了；相较之下，左旭升就逊色许多，不过是万万千千的小商人中的一个成功者，经过一番投机倒把侥幸赚到了大钱。","","进入中学后，左旭升和薛怜来你家的次数变多了，时不时留下吃饭。李光辉对此无比雀跃。在他的认知中，左旭升成为他的父亲，已是板上钉钉的事了。这颗钉子一钉就是十几年。","","所谓食不可不言、寝不可不语。召亭饭桌上可以没有酒菜，但不能没有话题。","","“嫂子，名字是很重要的。我念书的时候天天打架，就是因为名字。你要给小小一个好名字，她将来才会受人尊重。”","","“哪有那么严重。那时候野孩子多，你是年轻学坏了嘛。”","","“不不，真是因为名字。当初我爸去上户口，说我叫薛凌，两点水的凌。户籍科的人不会写凌字，写了两点水的令，变成了冷。但他也知道冷肯定不念凌，又把两点水划掉了。录档的人接过去，还以为两点一划是个竖心旁。到上学的时候，我已经变成薛怜了。你问旭升，他见过的，我小时候天天挨打，要不是后来跟了胜利哥，我早就辍学了。”","","“一开口天花乱坠的，嫂子你别信他。他别打人就谢天谢地了，发作起来谁都拦不住。话又说回来，是得给小小起个好名。你看我现在开公司，招人也是喜欢名字好听的。名字就是名片，能代表一个人的阶级出身，要不大人物发迹之后都改名呢。”","","比起自己的名字，你更好奇左旭升和薛怜的过去。关于薛怜四人组的为祸一方，你早已听过无数人的无数版本，其中不乏炸矿挖沙与烧杀抢掠的奇闻，要不是召亭没有港口，估计还得加上偷船走私和吸毒贩毒。在两点一线的学生时代，能与如此传奇人物相处，实在令你感到新鲜。","","“你们都是做大事的人。胜利有你们这样的兄弟，泉下也能瞑目了。我对俩孩子也没什么要求，安安稳稳在家，别惹事就好。现在时代不一样了，光辉在学校都不打架的。”","","“我也打架。我能一个打好几个！”李光辉急得饭都咽不下去，抻直脖子反驳，“我还要组建光荣帮呢！”","","薛怜点头作沉思状：“我认识一个人，也说要组建自己的帮派。你猜后来怎么样？”","","“赢了还是输了？”","","“答案是死了。”","","左旭升适时接过了话题，视线逡巡于你和李光辉之间：“所以，你们一定要好好念书。凭拳头就能取胜的时代一去不复返了。要站到更高的地方。站到不需要拳头的地方去，我讲的清楚吗？”","","你自动过滤了所有劝学式的对话。也许那个时代真的过去了，然而混乱之中才能诞生传奇。年轻的你渴望真正波澜壮阔的史诗，而现实回馈你的，只有饭桌上的闲谈，以及一本又一本的练习册。"],"chars":1031,"docx":"06-※-薛怜.docx"},{"id":"07-♡","no":"07","sym":"♡","key":"母亲","kind":"mem","view":"韩彬","paras":["你真正的母亲，大概是个温婉纤细的人。也许会像影视剧里传统的中产家庭妇女，端庄大方、讲话柔声细语。在你摔倒时，会温柔地伸手扶你起来，再俯下身去给你一个拥抱。","","可能是这样。你对母爱的想象很贫瘠，因为你也记不清了。打记事起，你的父母已经分居，你也被转交给奶奶和二姑照顾。二姑和姑夫经常为这事吵架。姑夫的观点是，他可以给自己的丈母娘——也即你的奶奶——出钱养老，但你一个小舅子家的外姓人，无论如何都不该花他的钱。","","他说这些话时，并不背着你，偶尔兴头上来了，也会对着你指指点点。你一般装作听不懂，一声不吭任他指点。他也当你听不懂，并不要你回应什么。你装作听不懂。但你没法强迫自己听不懂。你是外姓人，又不是外星人……虽说在你眼中，人类与外星人，并没有多大分别。","","后来你读初中，爸再婚了。婚后不久，爸把你从二姑家接去了他的家。爸结婚的女人带了一个孩子，比你小五六岁。你第一天进到爸和再婚对象的家时，他正趴在沙发上玩可擦画板——可擦画板曾一度是你最想要的玩具，然而还没等你攒够钱，这类玩具就被时代淘汰了。","","你拖着行李箱进入玄关，他从沙发上一跃而起，很戒备地打量你。你没什么动作。于是他慢慢靠近，仰着脑袋围着你转了一圈。你开口，试着和他打招呼。","","你说，你好。","","得到的回答是：","","你是谁呀？为什么要来我家？","","你有耳朵，也懂中文。哪怕没人明确告诉过你，只要稍一留心，也能从长辈们平日的对话里得出结论，你和他都是爸亲生的。对于初中的你，这实在是一种很难被描述的关系——虽然你也不打算跟任何人描述。爸总跟你说，你已经大了、也懂事了，平日要帮着多照顾弟弟。","","你想，他既有亲生父亲、也有亲生母亲。在这个家里，人人都要照顾他，谁来照顾你呢？","","然而你什么都没说。你只是沉默点头。这个家里照顾他的人的确很多。因为这就是他的家。他后来渐渐明白了，你不是来借住的亲戚家孩子，一时半会儿也不会离开。好在你们年龄差得很多，你并不会分走他的东西。","","他似乎不反感你。有时在学校里挨了欺负，也会报你的名字。你跟魏来出去玩，他会黏在你身后，要你带他一起。但你们年龄差距过大了。在互联网媒体尚不发达的年代，学生之间哪怕只差了一个年级，兴趣爱好和交友圈层都会天差地别，互相很难说得上话。","","大部分时候，你们只是彼此相安无事地生活。仅此而已。","","但你们终究是不一样的。","","某次为了学架子鼓，五年级的他和爸大吵一架。爸大概手头不宽裕，一时掏不出几千块的课时费，又碍于面子不能直说，只好拿什么“最近成绩不好、学这些没用、三分钟热度”的话来敷衍。","","他不服气，讲了些很难听的话。阿姨也站在他那边，劝爸咬咬牙，先把钱拿出来，让她陪孩子去琴行报名。爸被他俩磨得下不了台，没好气地掏张信用卡递给她，拿起车钥匙要下楼离开，撞上站在玄关的你。","","爸问你有什么事。你犹豫了一下。你说学校统一买教辅书，要交二百块钱。","","爸劈脸给了你一巴掌：“滚边儿去，一个两个都要钱！”","","可你又能滚到哪儿去？","","你什么都说不出，只是目送爸摔门离开。阿姨准备带他去琴行了，他欢欣鼓舞地找了半天外套。也许他们并没注意到玄关发生了什么。","","你知道，你们终究是不一样的。","","又过几年，你去读大学，只有寒暑假偶尔回去。","","你不在时，他们一家三口照常生活。","","你在时，他们也一家三口照常生活。","","他渐渐长大了。也许是因为见得少，每回见面，你都要重新认识他，仿佛认识一个陌生人。身高是人类的重要特征，也是你区分人类的重要方式。幸运也不幸的是，你无法顺理成章地匹配他人的幼年、少年、青年与成年。","","暑假的某个晚上，你在客厅刷手机。","","有人敲门。是爸喝醉了回家。阿姨起身去扶爸进门。你站起来去倒水，沉默着递在他手里，并扶住他另一条胳膊，好让他安稳坐在沙发。爸照例酒后手抖，杯子端的不稳，水洒在地板上。阿姨抱怨了几句。爸将杯子重重掼在桌子上。他声音很模糊，混着酒腥气。","","他说：“受不了就滚出去。这他妈的是我家。”","","是的，这是他的家。","","你不知道自己为何如此……失控。你什么都说不出。你只是转身冲进房间，粗暴地收拾好行李，拖着箱子、背上书包摔门离开。走出半条街，你才想起来没买火车票。然而你身无分文。你穿着拖鞋，在候车室睡了一夜，直到魏来和许应杰匆匆赶来，凑钱给你买了张回学校的车票。","","从此，你再也没回去过那个家。"],"chars":1703,"docx":"07-♡-母亲.docx"},{"id":"08-♡","no":"08","sym":"♡","key":"魏来","kind":"mem","view":"韩彬","paras":["与魏来的朋友关系，维持了很多年。","","彼此的共同朋友，陆陆续续都结婚了。一切不切实际的幻梦都消失在家庭的琐碎中，社交圈也被世俗搓揉得狭隘而逼仄。终于只剩你们二人，仍旧寄身于大城市的罅隙中，妄想捡几粒大人物指间不慎泄下的金沙——按召亭的说法，也称作「死打白工的」。","","魏来的母亲对此极度焦虑。多年来，她对你的态度历经热情、试探与愤懑三个阶段。最终，她执拗地认定，是由于你对魏来不切实际的奢望，才导致魏来错过适婚年龄，进而对魏氏的家族事业布局产生了重大影响。","","如果房贷也算事业的话。","","这种关系很难向长辈解释。在召亭源远流长的文化环境中，非亲缘的青年男女之间，能且只能孕育出婚恋的关系纠葛，否则就是偏离轨道的街孩子行径。","","认识魏来的契机很无聊。你们是高中同学。","","那年你搬进了父亲家里。同住的还有一个陌生女人、以及小你五六岁的韩清。","","十几年后的今天，也许人们很难想象到，搬家对中学生的社交圈有多么大的破坏力。在通讯设备被归类于奢侈品的年代，搬家约等于绝交，转学不啻于异世界穿越。按照召亭的常规剧本，你的青春能且仅能在两点一线的重复中不断流转，你的全部社交能且仅能围绕着家或学校。","","高中、是在召亭的县三中。学校惯例的时间表是早五晚十一。你并不是在抱怨，只是陈述事实。在这种时间设定下，逃课是一种强需求。许多人高一最先学会的不是数列集合，而是高速无声翻越电动栅栏门，以及熟练记忆学校围栏的薄弱点位。此外，大家更倾向于逃晚自习，而不是早自习。毕竟你可以在早自习的教室里睡觉，却不能在晚自习的教室里打球。","","直到你读高二，召亭环城河淹死了一个三中学生，是晚自习时候逃课出去的。自那之后，即使普通班的值班老师们，面对晚自习教室中空出的一个座位，也要不辞万难、千里求经般将人找回来。","","淹死的学生姓殷。","","她是自己跳进河里的。","","按照召亭三中的传统，她应该有个外号。有稳定外号是人缘好的表现，也是融入集体的基本要求。然而，她并没有什么外号。在你印象里，她是个随处可见的、瘦弱的、土气的、呆板的、下睑乌青又脸颊凹陷的女高中生。成绩方面，她也同样平平无奇。","","三中的习惯是，大小考都要将全班成绩单贴在走廊区，供所有路过的学生欣赏。据某些校领导声称，这种方式能激发学生的上进心和羞耻心，进而提高整体成绩。在重点四班门口，如果你想找到殷同学的排名，从下往上数会更快些。","","好消息是，她的死亡终于为她的人生增添了一丝奇幻色彩。不知是谁先起头，学生群体迅速达成共识，从此私底下称她为水鬼。如此独特的外号，仅凭跳河就能得到，大约算得上一种幸运。","","水鬼留下一封藏在桌屉的遗书。遗书是用答题纸的作文页写的，洋洋洒洒几千字，娟秀谨慎的字迹、挤满了四张作文页。是0.5毫米的中性笔。你和魏来在重点一班，遗书传到你们班时，厚重的答题纸已经卷边，附着有纹理清晰的指印。由于历经八手传阅，你至今不能确定，有几抹晕开字迹的水渍，是否真的是泪痕。","","班内几个理科生围在一起，卡着课间十分钟，快速浏览起这份超出规定字数的大作文，并各自进行简短评价。高中的魏来始终没找到打唇环的机会，头发也是清爽的板寸，而非网红式的亚麻色碎发。你时常把魏来跟其他男生搞混，只能凭声音进行区别。若干年后，这个气质干练的低气压角色、会被社会改造成轻浮系社交恐怖分子。读罢殷同学的大作，魏来评价其矫揉造作：","","“说不定一边写还一边感叹自己句句封神呢，实质信息熵极低，全篇就讲了点爹不疼娘不爱学也学不来的破事，结尾竟然落脚在孤独上，疑似想谈恋爱想疯了。”","","有理由相信，这段评语是夹杂私怨的。","","同一时期，魏来比任何人都想谈恋爱，也比任何人都渴望与女性谈恋爱。","","在那个时代，男生间流行一个笑话：","","“身上长蜈蚣怎么办？”","","通用答案是，去县北耍两天，因为县北有“鸡”。","","为了这个笑话，男生们常常意味深长地窃笑、意味深长地彼此对视，仿佛别人的不解、使得他们高人一等。尽管他们其中任何一个，都不曾真正与县北的特殊职业者发生过关系。至多不过在县北的网吧或台球厅里，哄骗过几个早早辍学的女孩，得手后又声称幡然醒悟回头是岸，将她们一并归到鸡的类别中。","","这就是所谓的青春恋爱。你还能指望什么呢。魏来渴望的浪漫故事，可能发生在纽约、巴黎或佛罗伦萨，却永远不会发生在召亭。县城的万事万物都太过沉重，一切浮在空中的浪漫情感都要兀然坠下，直至跌得粉碎。","","这就是你的青春。"],"chars":1745,"docx":"08-♡-魏来.docx"},{"id":"09-※","no":"09","sym":"※","key":"江恒生","kind":"mem","view":"李珀涯","paras":["高考结束后，与无数召亭学子一样，你紧锣密鼓地开始……考驾照。","","驾校建在镇上，每天来回要三四十分钟。母亲年轻时开车出过事故，从此再也不敢摸方向盘。九百块的修车钱严重打击了母亲的自信力。随着打破女司机偏见的浪潮兴起，她愈发抗拒开车，生怕自己给女人丢了脸。","","接送你的任务被外包给左旭升和薛怜。左旭升上班晚，负责送你过去；薛怜下班早，负责接你回来。","","对于考驾照，左旭升给不出任何建议。","","“你舅舅运气最好。当年我们三个去车考，只有你舅舅是自己考上的。交警队的人非说我压线，想诈我的补考费。我被否了两回，托别人替考才过的。之后薛怜去考，我就买了两条烟给他，他给考官捎去，当天就过了。现在肯定不能这么搞，早时候召亭太乱了，没办法的事。”","","正是由于左薛这类情况的存在，到你十七岁这年，驾考已经变成无聊的按部就班，车内车外遍布摄像头，笔试路考全部引入机器检测。作为召亭人，你自然是站在交警的对立面，暗骂其恃权敛财的卑劣行径。","","“知道吗，你舅舅要回来了。”铺垫了半天，左旭升引出正题，“你见过我们年轻时的合照片吧？四个人里戴眼镜的就是他。”","","“他不是死了吗？”","","“小薛的话你也信？你舅舅是去南方做生意了。”","","赶在暑假的末尾，你见到了江恒生。彼时的江恒生已经沦落成气质庸俗的中年人，身形臃肿地踞在沙发上，对母亲颐指气使。你向来不信任亲缘联系。哪怕母亲和小叔叔以言语不断塑造李胜利的高大形象，然而死亡模糊了你对他的记忆，直到他被简化成一个象征父亲的符号。","","对李胜利尚且如此，针对阔别数年的江恒生，你更是如临大敌——当年是他卷走了家里的钱，抛下母亲和李胜利逃跑了！","","“小小长这么大了？小时候我还抱过你呢。”他讪讪地对你示好。你不应声。","","其实你已经不是李小小了。你的驾照上写了自己的新名字。你翻了许久的字典，才确认自己的新名字。薛怜说得对，名字会改变很多。你已经不小了。","","“光辉，就是他！就是这个四眼！”","","你和光辉结成同盟，用尽手段把江恒生赶出家门。大学报道那天，直到母亲和李光辉送你到火车站，你都不忘叮嘱他们：","","“妈，你以后千万不要理他！他要是敢借钱，你就找人揍他！李光辉，家里就交给你，有事给我打电话。一定别让他再进家门！”"],"chars":885,"docx":"09-※-江恒生.docx"},{"id":"10-□","no":"10","sym":"□","key":"张昊阳","kind":"mem","view":"张昊阳","paras":["查到自己11科全A时，你进召亭三中就已毫无悬念了。你带着同镇的兄弟们出去野了两个月——大部分时间在网吧、小部分时间在台球厅——最后拖着行李、扛着书箱被客车送进县城。","","在中国北方，绝大多数县高，都是无条件信任衡水之神话的。这种扭曲的信任，在执行上往往表现为：","","凌晨五点半开始的早读、夜间十点半结束的晚自习、上千人规模的食堂竞速大赛、无下限压缩的午休时间、百分百禁止电子设备入校、仅存在于课表上的体育课、熄灯时间强制断电、每月15个小时的假期......等等等等。","","召亭三中也不例外。在这种环境下，你的成绩长期能在班里乃至级里名列前茅，绝非是因为热爱学习、志向远大之类的空话。你只是没其他事可做，不得不日日温书做题、聊以消遣。再者，县高的生源也好不到哪儿去，只要付出9.9%的努力，就能胜过99%的学生。","","考虑到本校的学生数量，99%的比例并不是在夸张。","","然而，即使纸面上的成绩可以短暂带来满足感，却无法缓解更深层的无聊感。除了老师和你的竞争者，大部分同学并不在意你「数学考了142还是149」、「排名进了级五还是掉出级二十」。","","但如果你只跟竞争者交往，那就太恶心了——难道要浪费你的大好青春，一天到晚猜忌别人夜里有没有偷偷打手电学习？","","你被这种无聊感折磨了半个多学期，直到你决定利用起某种特权。","","高中是一个封闭的小社会。","","在这个封闭的社会中，也存在着等级。日本的校园漫画中，常常出现“主角或配角依附甚至攀附班级的高位者，从而达成某些社交目的、避免遭到群体性孤立”的微妙剧情。然而，在你所就读的县高、四五十人的班级里，诸多小团体往往是彼此独立的，表面并不存在明确的上下位或依附关系，也很少出现能引导舆论风向的「高位者」。","","一模一样的校服之下，你很难迅速分辨出所谓的「等级」。","","特权却是几乎完全公开的。比如——同样是上课睡觉，有些人会被拎着耳朵提起来罚站，有些人却能得到老师的关切：让他睡会儿吧、他一定是熬夜学习了、等讲到新知识点再叫他。","","是的，由成绩所带来的特权，是最显著的。因为它直接与金字塔的管理者相关。","","你可能要问了：如果是重点班呢？一所普高，总是要有所谓的优班与差班的。如果处在优生云集的重点班，特权也会大打折扣。","","所以，最关键的一步是，别去重点班。","","高一分班时已是新高考。六门副科随机打乱，也即所谓的3+3制。由于老师调度不开，重点班只配给部分热门组合。你需要选一个冷门、但又不能太冷门的搭配。毕竟，如果某个组合选择人数过少，学校会直接把这个组合砍掉，粗暴地把你调剂到某个热门组合。","","你选对了。选组最后两天，级主任找你谈话，劝你改选最人上人的全理。你说没事，反正高考是一样赋分。","","两天后，你被分进了19班。","","19班的气氛很好。前所未有的好。班上其他四个同镇人都是你初中同学，彼此父母也都熟识。你们每月放假时坐一趟客车回家，再坐同一趟客车返校，所有人从家里带东西都要带五份，家人给寄来的物资也恨不得掰成五份。","","更巧的是——其实是苦心经营的结果，但这是另一个故事了——你们五人都在同一个宿舍。你们天然结成了牢不可破的联盟。按方言说法，这叫作“一拨人”。","","联盟总会有外部敌人。你们第一个敌人，是班上的社会哥。","","如果用一句话形容社会哥，他大抵算是一名聪明的精神小伙。太聪明，以至于不幸地考上了高中。太精神小伙，以至于荣获社会哥的美誉。社会哥不幸地跟你们同一宿舍。六人寝室里，他是唯一一个烟瘾分子。","","你大可以想象那种绝望生活。上完无聊的晚自习，回到没有阳台的阴湿宿舍，迎面而来的，是二手烟的味道，尖啸着攻击你的灵魂，半夜有人在你下铺燃起磷火一星，偶尔还有旧风箱一样的咳。","","其实抽烟在县高很正常。周敦颐说，莲花是出淤泥而不染。你不是莲花，混多了网吧台球厅，也抽过几支烟。其他几个同镇人也一样，只是有多有少。但社会哥不一样。哪怕隔着数十公分，辛辣的烟油味儿也能直冲你的鼻腔、毫不客气地攻击你的整个嗅觉系统。","","许多年后，在省城重高读书的妹妹跟你讲，她很喜欢某种恶徒设定：西装革履的男主角捻灭一支香烟，指尖残留着淡淡的烟草味儿，很轻蔑地伸手掐住你的下颌，佐以居高临下的眼神，氛围绝佳。","","那一刻，你回想起社会哥。于是一股粘稠的酸痰味儿自回忆中袭来。既不是淡淡的、氛围也不佳。只有纯粹的恶心。完全不带任何修辞意味的，生理上的恶心。","","你们并没劝他戒烟。抽烟在当时也算人之常情。再者，他混的是召亭的“社会人”圈子，抽烟属于一种生活方式，而非兴趣爱好。然而，一手烟和二手烟的区别是很大的。哪怕你们能说服自己抽烟很正常，但生理反应不会骗人。","","虾皮是第一个受不了的。他让社会哥去宿舍走廊上抽，以后别在宿舍里点烟、更别在宿舍里半夜点烟。","","但是不行。走廊上有监控。社会哥被抓住通报批评了一次，又躲回宿舍里抽。又过了一周，虾皮也开始跟着他抽。小小一个破宿舍，半夜跟他妈的仙境一样。","","所谓攘外必先安内。第二天，你跟剩下几个舍友逃了课间跑操，先把虾皮骗进空教室里揍了一顿。虾皮被揍服了，立誓保证说他以后只在教学楼厕所里抽，烟把子都不敢带进宿舍。","","于是你们五人和好如初，开始商量对策。","","你一连几天睡不好，上课也想这事。月考结果发表，你级排名掉出前五十。","","这已经算是天大的事了。","","如前所言，高中是一个封闭的小社会。你每天面对同样的人、做相似的事，任何一点细小的变化都足以触动你脆弱的神经，甚至足以让敏感者崩溃。你不能指望在县高经历什么生离死别。偷摸谈个恋爱就已经比犯天条更刺激了。当你的活动半径被无限缩小、缩小、缩小、缩小，你的情绪就会被困进一些芝麻大的小事中来回打转。","","有那么一瞬间，你得出一个结论。一个荒谬的、无限滑坡的结论。","","“你的人生会因某人半夜抽烟而彻底毁掉。”","","你需要采取进一步行动。","","不是需要——而是必须。"],"chars":2303,"docx":"10-□-张昊阳.docx"},{"id":"11-□","no":"11","sym":"□","key":"赵烁","kind":"mem","view":"张昊阳","paras":["在今日的互联网，霸凌似乎是个热门话题。每时每刻都有无数人在无数个角落里谈论着自己被霸凌的经历，从皮肉教训、金钱勒索聊到精神折磨。","","大多数时候，这些由被霸凌者讲出的故事，总是单方面痛斥霸凌者的残忍与罪恶。然而，如果将霸凌一词严格限定在蓄意性、重复性以及不对等性的基础上，许多自述故事并不能完全符合霸凌的条件，顶多只能算作不愉快的经历。","","你并不关心词语滥用之类的话题，也完全不想探讨霸凌的严格定义。你真正想表达的是，哪怕霸凌一词的含义在当代已经如此宽泛，在县高，学生们几乎很少讲这个词。","","按照冷暴力与热暴力的区分，客观意义上，你们以两种说法来替代霸凌——","","打架打输了，以及人缘不好。","","社会哥打架打输了，只好狼狈地搬出宿舍；荔枝姐人缘不好，因而丧失了社交权利。","","前者是你运作的结果，后者则是鲸鱼的杰作。","","高一下学期，虾皮和鲸鱼正式确立了恋爱关系。虾皮和鲸鱼都是你同班同学，毕竟这里是县城高中，不是海洋奇缘。外号文化在召亭三中流传已有十余年，虾皮的外号源于下邳之战，而鲸鱼则是谐音——她的名字就叫“jingyu”。","","顺带一提，你的外号是耗子，至于原因……你不太想讲。","","总之，你对这段恋爱没有任何意见。","","然而，自打二人开始谈恋爱，一天要传八万次纸条，而你恰好处在二人传信的必经之路。","","几天后，你的身体被驯化了。","","巴甫洛夫的狗一摇铃就要流口水。你只要感到脊梁被戳，就会不受控制地单手向后接下纸条攥掌团成一团并在保持低头写字的情况下无视野将纸团扔到前桌桌子上；前桌抛过来的纸团，你也能低着头扔到后位虾皮的桌子上。","","幸运的是、或者说不幸的是，在你冲虾皮发火之前，二人的恋爱关系迅速被学校侦破。根据线人密报，班主任撞破了这对小鱼小虾在楼道口的密会。这场恋情随后被上报到级里，成为“密接”——异性间非正常密切接触的典型。","","彼时你以特权生自居。只要成绩优秀且性格沉稳，老师自然而然就会对你更亲近，讲话也会更随意。这也是特权的一部分。利用这份小小特权，你时常打听到一些琐碎的消息。","","于是，当鲸鱼来找你时，你直白地回答她：是荔枝姐向班主任揭发了二人的恋情。有关她的检举动机，你并不清楚，毕竟你跟她完全不熟，而三手消息也不一定可信。此处三手消息是指：你所得知的荔枝姐，仅仅是虾皮从鲸鱼口中听来又转述给你的、数量极少的碎片信息。","","高二上学期的期末考试结束，你重回年级前二十，鱼虾的密接罪——异性间非正常密切接触——也解决了。由于你的考前辅导和作弊辅助（辅导效果存疑、主要还是靠作弊），二人期末都进了班级前十五，属重大「戴罪立功」情节。考虑到二人认错态度良好、承诺永远分手、状态调整迅速，学校最终处理结果是严重警告一次，不记入档案。","","可以想见，两人并没有真正分手，只是表面消停了一阵，至少传纸条的频率降低了不少。","","短暂的寒假结束，荔枝姐开始哭了。","","是“开始哭”，而非“哭”。因为这一行为几乎贯穿了她的高中三年，甚至成为了你高中记忆的一部分。","","第一次注意到时，是在一次随堂小测。你提前交了卷，回座位的时候路过，瞥见她正低着头，眼泪滴在试卷上。她愣愣地盯着自己试卷上的泪渍。最初，她的哭并没有声音。后来，她逐渐低低地抽噎。到最后是明目张胆地啜泣，甚至连隔着半个教室的你都能听见。","","她喜欢在晚自习发作。也可能她哭的频率远比你想象中更多，只是晚自习相对安静，更容易被注意到。这类哭声往往传达的信息是：有没有人来安慰一下你？你现在很难过。","","你没法对此抱有同情。写题写到一半，思路被哭声打断时，你甚至会觉得她碍事。你不清楚其他人怎么想。可以确定的是，即使她哭得那样显然，除了晚自习的值班老师偶尔问她两句，平日并没有任何人安慰过她。大家只是由着她哭，直到她自行停下为止。","","这样的哭声两三天就要来一次。在安静的教室里，只有她的哭音悬在上空。晚自习的教室里通常有46个学生，她的哭声却仿佛来自另一个世界。","","一个无人的世界。","","虾皮放假要回镇上，鲸鱼是城里妹。每每结束短假，二人颇有小别胜新婚之感，传纸条的热情也高涨。俩人纸条写多了，虾皮又给你传三手消息。据虾皮转述的鲸鱼的观点，荔枝姐总爱哭，是因为女生圈子都不跟她讲话，说她是全班公敌。","","你问，然后呢？","","虾皮说，没然后了。","","你没再问。感觉没什么好问的。虾皮也没再说。他也没什么好说的。说到底，你们都跟荔枝姐不熟。短后的第一次月考结束了。晚自习打了铃，荔枝姐没来教室。","","事后你才知道，她爬上了五楼的窗台。"],"chars":1771,"docx":"11-□-赵烁.docx"},{"id":"12-△","no":"12","sym":"△","key":"陈静雨","kind":"mem","view":"何晓轶","paras":["整个高中时代，你与任何人都称不上朋友。高中时，由于宜州市南区拆迁重建，你随母亲回了县城老家，等你转入本地的召亭三中，已经是高一下学期了。","","县高是单休。不是指每周休一天，而是每月休15个小时（含睡眠）。作为走读生，你强迫自己适应了凌晨五点半的早自习和半夜十点半的晚自习。","","最令你难以接受的是：没人讲普通话。学生凑在一起、倾向于用召亭话交流，你勉强能理解。然而，连老师上课都讲方言，这实在是一件匪夷所思的事。尤其是那些四五十岁的老教师，一开口就是浓重的土腔，简直不知所云。","","好在本地词组大多能与普通话彼此对照，你花了将近半个月才完全适应。","","对于成年人而言，半个月只是一天重复十五次。然而县高绝非如此。半个月、也就是将近两周。两周。除了睡觉，你几乎完全无法离开学校。考虑到学校已经成为你唯一的社交渠道，两周已经足够长了。","","足够长。","","足够令你错失构建人际关系的最佳时机。","","足够让你成为边缘人。","","班级的小团体势力划分，大约是从高一上学期分班后建立起来的。那时你还没来三中。你本应加入以鲸鱼为核心的城里妹阵营。然而你总是下意识讲普通话，于是鲸鱼笑嘻嘻地当面说道：“大城市来得就是不一样哈。”","","你并不认为鲸鱼对你有明确的恶意，也许她只是觉得交流不方便。其他城里妹却不同。当鲸鱼说出那句话时，你立刻感受到周围人隐隐的敌意。这种敌意，会随着小团体内部的交流而不断累加。而你并不是个擅长应对玩笑的人——你甚至不会讲召亭话。","","从那之后，你成了边缘人。","","话虽如此，你并不认为自己受到了排挤。","","人的时间是有限的。在一个小团体当中，每个人的时间都是有限的。跟A讲话多一点，跟B讲话就得少一点。每个人都会在心里给「朋友们」列一个优先级——通常是无意识地——哪怕是三人小团体，也总会出现关系更好的两人、无意中冷落了第三人的情况。你只是优先级过低罢了。","","当她们找不到合适的人讲话，你也会成为选项之一。如果你想找人讲话，也总有人会应你几句。","","真正的排挤，一定是有意而为的。","","比如，所有城里妹都完全不跟荔枝姐讲话。","","此事似乎由来已久。","","据其他人所说，荔枝姐向班主任告发了班里鲸鱼和虾皮的早恋，这种打小报告的行为让她人缘败尽。至于理由，有人说，她是想讨好老师，当个假模假样的好学生；也有人说，她羡慕鲸鱼家里比她有钱，所以想利用告密来报复她；还有人说，她也偷偷喜欢虾皮，所以想借学校的力量拆散他们俩。","","在你看来，这些传闻往往充斥着主观臆测。哪怕人人都言之凿凿的“荔枝姐是告密者”，如果你追问消息来源，对方也只会摊手告诉你：“反正大家都这么说。”","","你不该扫别人的兴。尴尬的情绪正要爬上对方的脸。","","于是你也不再问。"],"chars":1064,"docx":"12-△-陈静雨.docx"},{"id":"13-△","no":"13","sym":"△","key":"韩彬","kind":"mem","view":"何晓轶","paras":["“所以，你真的会杀人吗？比如说，把人封进水泥里沉河？你有枪吗？你真的会砍人手脚——”","","“等一下。我是秘书，不是黑帮。你对旭凌集团的幻想太丰富了。”","","“幻想？你这不是正在绑架我吗？”","","“……又没有真的绑架。”","","“假绑架也是绑架。今天敢假绑架，明天就敢真杀人。一开始是打架斗殴，后来变成地盘割据，最后全面合法化。黑社会都是这么兴起的——没有说旭凌是黑社会的意思。”","","“没关系。怎么想都可以。资本主义不存在忠诚。”","","“哈？明明你穿得这么正经，内心却是个文青啊。竟然说不存在忠诚？你都利益相关了，怎么能思想不坚定呢？要是没有旭凌，宜州早就被房地产冲垮了。只有实业才能拯救市场，拯救市场就是拯救宜州，拯救宜州就是拯救召亭。等我大学毕业，我也会去旭凌工作的。”","","“是吗。那我们就是同事了。”","","“那很难欸。我以后要学医药，不会当秘书的。”","","“我大学主修也是医药。以前是做医药代表的。”","","“真的？你不会骗我吧？完全看不出来啊。医代应该都很擅长沟通交流吧？你都没有我健谈，真的当过医代吗？话说你为什么会当秘书啊？电视里的秘书都是漂亮女生嘛。你平时都做什么啊？我之前问你你还没回答呢，你真的会杀过人吗？旭凌那些传言都是真的吗？你跟旭总私交很好吗？你——”","","“——你很紧张吗？”","","“什么？”","","“因为你一直在讲话。抱歉，办公室里确实挺无聊的。你想去哪儿玩吗？”","","“能出去吗？可是你在绑架我啊？”","","“我说过了，又不是真的绑架。只要让你爸找不到你。”","","“你不怕他报警吗？”","","“什么意思。你在讲笑话吗？抱歉，我没听懂。”","","“就是……算了。我不想说了。”","","“你先在这边待一下，我得去开个会，有事可以喊我。对了，你想玩电脑游戏吗？我的笔记本可以借你玩。”","","在被绑架的三天里，你狂玩了十几个小时电子游戏。直到父亲签字同意搬迁，你才被旭凌集团释放回家。临别之际，你与韩秘书告别，也与自己的《城市：天际线》存档告别。","","两周后，宜州市南的旧街区被挖机摧毁。","","旭日所及之处，宜州欣欣向荣。"],"chars":800,"docx":"13-△-韩彬.docx"},{"id":"14-△","no":"14","sym":"△","key":"张昊阳","kind":"mem","view":"何晓轶","paras":["小班长的班费丢了。","","据她自己说，昨天下午还在抽屉里。她今天早读时想换本书背，打开抽屉，发现班费没有了。","","她问你，昨晚放学时，有没有谁接近过她的座位。","","你无言。昨晚学校停电了，你连自己在哪儿都说不清楚。","","小班长在你这儿得不到答案，又跑去问别人。到午休时，她已经得出了初步结论。她向座位周围所有人讲述了她的推理和结论：“肯定是虾皮做的！我又没有让他帮你收班费，是他自己说帮忙的！而且也只有他知道是在抽屉里的纸包，别人就算想偷，昨夜里没有光，靠摸肯定找不到的。”","","不少人明确表达了赞同。与她交好的几个女生大都采纳了她的看法，陆陆续续也有不少城里妹被她说服，甚至提出了新的证据：虾皮父母是在村镇劳务队里干瓦匠的，即使在县高、经济条件也算不上好。虾皮本人除了时常打架，背地里似乎还抢过钱。","","在你看来，班费数额并不大，统共两百多块。班里没有空调，水卡校服日常用品都是自费，活动也很少，没有募集活动经费的必要。所谓班费是指，每人每月交五块钱，批发的习题册和草稿本会优先从班费中扣除——批发会比单买要便宜许多。偶尔班费不足时，班主任也会帮忙垫付，多余的就留到学期末请全班吃零食。","","正因数额不大，当鲸鱼得知小班长四处宣扬虾皮偷钱时，她趁着午休时段，带两个城里妹走到前排，胳膊靠在小班长的课桌上：“弄丢了就弄丢了，无所谓，不用攀扯别人。一点小钱，大家不会怪你。”","","“跟你有什么关系？又没说是你拿的。”小班长冷冷反呛，“你那么有钱，怎么不给对象花？你早给他花了，班里也不会丢钱。”","","“别说没用的，我给你垫上不就行了？你要是找得回来，就留着自己花。”","","“都说跟你没关系！”","","鲸鱼脸色变了。她毫不掩饰地翻个白眼，转身离开。同鲸鱼交好的两个城里妹也跟着她离开，一个帮她把钱捡起来塞回她口袋，另一个低声安慰她，让她“别跟那种人一样”。","","小班长受了屈辱，跑到后排与虾皮对峙。她人虽小巧，声音却很尖，激动时就更尖。对于她的质问，虾皮一一回应，语气很温和。然而，对于偷钱的指控，虾皮全然否认：“这没道理的，我的抽屉和书包都给你看了。要不你再找找？……你先别哭。我刚说重话了？有吗？”","","“你要是没拿，干嘛让鲸鱼帮你垫钱！”","","“我什么时候让——”虾皮不自觉提高了一点音量。说到一半，他止住了声音。也许意识到周围人在午休，他顿了一下、将声音压下去，“我没让她帮我垫钱。这没道理的。”","","虾皮前座的耗子被二人的对话吵醒，他恹恹地转过身来。","","“你怎么知道他拿的？你查监控了？”","","“停电哪有监控？”","","“那你鬼叫什么。搞得铁证如山一样。”","","“你什么意思？我陷害他吗？！我拿班费陷害他？！”","","小班长并不只是声音尖，她几乎真的在尖叫。","","你嗅到空气中的不满。不是小班长对耗子的不满，而是午休被吵醒的不满。陆续有同学望向她的方向，带着疑惑与烦躁。耗子没有回应她的尖叫。他只是不动声色地注视她，仿佛欣赏一个笑话。一个歇斯底里的笑话。","","小班长的气势逐渐减了下去。她的情绪撞在一堵墙上，失去其正当性。你能看见她的背影。双肩颤抖的背影。虾皮抽了两张纸巾，小心翼翼递给她。她并未接下，只是啜泣着回到前排。虾皮叹了口气，将纸巾塞回纸巾盒。耗子重新趴回去睡觉。","","你暂时不想靠近前排，于是出门去打水。","","水卡插进去，透明水杯慢慢被填满。诚然，你天然倾向于情绪稳定的人……","","水从杯口溢了出来。"],"chars":1331,"docx":"14-△-张昊阳.docx"},{"id":"15-□","no":"15","sym":"□","key":"丁凯奇","kind":"mem","view":"张昊阳","paras":["哪有什么帅而不自知。","","只有会装和不会装。","","帅的人一定会知道自己帅，否则就算不上真正的帅。原因也很简单。如果你具有外表方面的先天资本，你会时时刻刻接收到这方面的反馈。你生活中所遇见的一切，都会有意无意地提醒你：你长得很帅。","","社会对外貌优越的人总会下意识宽容。多数时候，只要虾皮摆出一副茫然的无辜相，再说几句不痛不痒的软话，冲突就能自然而然地化解。那起盗窃案，就是这样解决的。虾皮随便说了几句温和的话，又让她搜了搜抽屉，小班长就被轻易说服，恼羞成怒地走了。","","小班长丢的是班费。班主任表示算了，事情都过了好几天，钱要找回来也难。她这月先把钱垫上，以后的班费她自己来收，不用小班长再过手。","","小班长彻底偃旗息鼓，而鲸鱼对小班长先前的态度很不满意，几乎又发动城里妹们跟她冷战。","","同一时期，荔枝姐也结束休学，被父母强制送回来念书。","","一个班里若出现两个公敌，多少有点无趣。","","赶在放假前的下午，小班长来后排找虾皮。她很郑重地又道了歉，还送他一件礼物。一个很细长的盒子。虾皮推辞了几句，推辞不掉。接过去打开盒子，是一支精致的钢笔。虾皮故作夸张地倒吸一口气，向小班长道谢，又推辞了几句。","","小班长很坚决要他收下，随后跑开了。","","她时机挑的很好。还有十几分钟就是假期，二人没时间多纠缠。等放假回来，彼此都沉淀了两三天，虾皮很难再度提起此事。虾皮拆开看了看，又将零件装回去，蘸水写了几个字。又写几个字，虾皮玩腻了，将笔随手收进了口袋。","","你们几个同镇人一伙儿出了校门。虾皮跟在你们后面，跟鲸鱼凑一块儿聊天。","","有人在校门口等你们。大约有十二三人，都没穿校服。","","是社会哥叫来的西中学生。自从被你以绝对暴力驱逐出宿舍，他忍辱数月，就为了凑这些人来复仇。","","这其实很可笑。事后他会知道，他的复仇毫无意义。不过，当时的你们，完全没搞清是怎么回事。在当代中国，你走在大街上，突然遇见一群人、二话不说就迎上来揍你——即使在治安混乱的召亭，这也是小概率事件。","","虾皮个子高，在涌出校门的学生里，格外容易辨认。他是最先被包围的。他一把将鲸鱼推远，然后将书包往外丢，砸中了几个人。有人绊了他一下，他向后趔趄，被不知名的手攥着领子、一下摔了出去。","","你提起书包想跑，被绞住脖子拉进了人堆。虾皮摔在地上，口袋里的钢笔也摔出去。他抓起那支钢笔，单手将笔盖扳开。在一片混乱里，他攥着钢笔、扯着周围人的衣服爬起来，探臂直直地捅出去，插进一张不认识的脸上，旋转、旋转、滑动、滑动。","","你躲开十几双手，躬身从人群里往外爬。你花了十几秒——也许是几分钟，然而你完全失去了对时间的感知——才钻出去。手肘蹭在地上，火辣辣地疼。有一瞬间，你觉得自己确实像只打洞的耗子。你钻出人群，从地上爬起来。","","鲸鱼站在学校门口的「风采榜」前。她借了部手机，正在跟人打电话。你大声喊她的名字，让她别报警。虾皮听见了你的话。他把手底下的人推开，粗暴地撞开人群、冲出去夺她的手机，一双淌血的手伸过去，几乎掐住她的肩膀。","","你去拉他、让他快走。他个子太高了，你完全拉不动他，几人合力才将他推走，拖着他到路边的站台，再拼命将他推上客车、按倒在座位上。","","他反手抓住你的胳膊。他手上的血还没干，黏腻地糊上你裸露的小臂。你将胳膊抽出来，用上衣前襟给他擦了擦手。白色的夏季校服被蹭出一片橙红色，你没什么感觉。反正你身上已经够脏了。就在几分钟前，你还在地上爬。","","虾皮愣愣地望着自己的掌心。回镇的路上，他反复只说两句话。","","“……我操……我要政审。我完了。”"],"chars":1396,"docx":"15-□-丁凯奇.docx"},{"id":"16-△","no":"16","sym":"△","key":"丁凯奇","kind":"mem","view":"何晓轶","paras":["毕业后、你决定留在宜州工作。","","陆陆续续、几个高中校友也来了宜州。召亭是大县，每年要为宜州输送千千万万的劳动力。不少年轻人都是召亭三中的毕业生，于是有人牵头，组织了一场三中同学会。彼时，你的恋爱生涯尚未开启——你所有的空闲时间都保留给自己，不必被迫为他人着想。自然而然地、你参加了同学会。","","“啊、中央一！晓轶，你没怎么变样子呢。”","","一进门、有人唤你高中时的外号，是个高个子青年。迟疑片刻，你记起了对方的身份。中学时，同学们都叫他虾皮。你不记得这个外号的来源了，似乎与历史笑话有关。从外表看，身形挺拔的丁凯奇与现实中的“虾皮”毫无关联。","","同届学生里，此人算是个风云人物，以容貌出众而著称。哪怕是刻薄的秃头级主任，偶尔也会从后门探出头来，笑眯眯地打趣：","","“你们班那个俊青年呢？叫他来搬书。”","","落座聊了几句，虾皮的大学离宜州很远，同期少有人来宜州就业。据他自己说，是为了在宜州的女友，才特意考来了宜州的检察院。出于社交礼仪，你称赞了几句他的痴情。丁凯奇竟然会跟赵烁走到一起，这实在出乎了所有人的预料。","","然而你知道，事实远非如此。","","那年高校间流传起一份二十多页多页的文档，包括你在内，在场绝大多数人都读过。文档的内容足以将丁凯奇赶出学校，也赶出当地校友圈。由于滥情行径被本硕期间的女友们联合戳穿，他几乎是连滚带爬地逃回了宜州，以躲避某种身败名裂的惩罚。人们故作熟稔地跟他打招呼。然而每一道目光落在他身上，都仿佛享用一个放浪的笑话。","","陈静雨——他高中时的初恋女友——举着手机凑过来，热切地跟他合影：“听说你做检察官了？你不是进过派出所嘛？我还以为你过不了政审呢。你低一点嘛。算了，你直接蹲下吧，我拍照角度很难找欸。”","","有人轻拍你的肩。","","“嘿，你不是何晓轶嘛？”","","你记得他。他是张昊阳。高中时，他被称为耗子，不仅因为名字谐音，长相的确也有老鼠的韵味：尖尖的鼻头、瘦削的下巴。作为十二生肖之首，他是只骄傲的耗子，浸在优绩主义蜜罐中的硕鼠，卧在高处的橱柜中俯视芸芸众生。","","你们自然而然地握手。简单的握手，构成了你们毕业后的全部交集。"],"chars":844,"docx":"16-△-丁凯奇.docx"},{"id":"17-♡","no":"17","sym":"♡","key":"韩清","kind":"mem","view":"韩彬","paras":["“是你安排的人？你也动手了？”","","沉默。","","“你要告诉我事实，我才能帮你解决问题。我不会打你的——我打过你吗？你不相信我吗？”","","沉默。","","你不想这样对他讲话，你不想与他成为陌生人，你身边的陌生人已经够多了，即使他的面目也像个陌生人。你不忍对他露出假笑，即使他很久不再对你笑了。","","天呐。你怎么会有这么恶心的想法？肯定是魏来的浪漫幻想……那些纯粹臆症的浪漫幻想感染了你，以至于你对韩清也心生怜悯。没什么好怜悯的。无论从任何角度分析，他都是个彻底的失败品了。你现在站在这里，只是出于情分。","","只是情分而已。","","“你还想读高中吗？”","","你抛出鱼钩。","","上钩了。","","“你以为我是想上吗！我本来就考不上高中，爸非把我弄进西中去。我说我没打架！没打架！我跟他们也说了，我就是凑人头才过去的，他妈的没人信我啊！”","","韩清啐了一口，手插在校服口袋里掏了半天，掏出一副软瘪的烟盒，摸索着抽出一根，递在你手边。","","是旭凌分部生产的纸烟，唯二的优点是便宜和薄荷口味。在召亭人心目中，薄荷味总与溢价严重的口香糖相关联。作为口香糖的平替——没错，香烟是口香糖的平替——这款烟在青少年群体销量居高不下。","","比起未成年的健康，小卖部更关心未成年的钱包。他们对暗访者和蔼地微笑。慈祥的老奶奶连连点头：我们都响应政策，不给孩子卖烟酒，那些孩子是给他们老子跑腿咧。据说在二十年前，这类故事会更加戏剧化：烟不卖老子？你不想在这片儿混了？别他妈找死！","","“我不抽烟。你以后也别抽了。”","","“去你妈的，咱俩都一家人，你给点面子。”","","你叹了口气，接过香烟拢在手心里。他将烟盒团成一团，塞回了校服口袋。按照街孩子的规矩，这叫作“散烟”。同类的规矩还有“护烟”：倘或你给他人点烟，对方须以手掌拢住，为你的火苗挡风，哪怕无风可挡。在街孩子的观念里，这表现了受火者的教养，以及对点烟人的尊重。","","你没有点烟，只是随手搁在口袋里。散过烟，就算你们和好了。实际上，你们本就没吵架。是他单方面在闹小孩子脾气。你是来解决问题的。一个高中生、站在县城深夜的马路沿给你散烟，这解决不了任何问题。","","“所以是怎么回事？”","","“没怎么回事。三中有个混社会的，被人给揍了一顿，东西也从宿舍扔出去了。那群小子学习好嘛，人也多，他治不过人家，就来西中摇人。”","","“是你朋友吗？”","","“没，不熟。我就帮他摇了几个人。这帮孙子一进派出所，都说是我攒的场面。他妈的，谁能想到丁凯奇那么邪？脸都给人划剌穿了，缝了四五针，眼也弄得半瞎。我当时就说吓吓他们，谁知道……”","","“你没动手？”","","“没有。我都没近前看。让他们查嘛。我不怕查。”","","“好。我相信你。”","","你相信他。即使在旁人看来，街孩子们总是谎话连篇。是谁教他们沦落到说谎的境地呢？说谎是软弱的证明，是一种本能，一种逃避惩罚的本能。谎言如同流感般蔓延在召亭，年轻人天然学会了说谎，你也不例外。","","你想到薛怜曾讲过的一个词：双重思想。","","说谎的本质是双重思想。","","你相信韩清。你要让他也相信你。","","别天真了。他凭什么相信你？微薄的血缘关系？你早就跟他的父母断绝来往了。信任？好好回忆一下，许应杰对你仁至义尽，可你又是怎么对他的？你加入了旭凌。你背叛了他。他信任你。信任。信任是多么脆弱啊。如果这一切是由于你的卑鄙无耻，那韩清就比你高尚许多吗？","","不，你并不卑鄙。并非如此。你只是个正常人。你必须坚信自己是正常的。","","“不想上就算了。回去收拾行李吧。”","","“啊？”","","“我带你去宜州。”"],"chars":1364,"docx":"17-♡-韩清.docx"},{"id":"18-※","no":"18","sym":"※","key":"杨天一","kind":"mem","view":"李珀涯","paras":["对于美人，你自有一条准则：美而不自知，是美人的基本修养。可惜，现实中的美人们，往往自幼被无数赞美裹挟，难得不自知。自知并非罪过，然而至少得装作不自知，并克制住引人关注的欲望，否则就显得卖弄风骚，沦落俗套。","","按照这套标准，丁凯奇的确是称职的美人。唯一的缺点是——","","“凯哥看着不太高兴啊。”李光辉正挥着铁锨挖土，悄悄给你使了个眼色，“是不是你对他太凶了？我觉得你有时候讲话……”","","“你挖快点行吗？要不我把这个也复活，让它和你一块儿挖？”","","丁凯奇通常面无表情。","","这并不是他天性高冷，你见过他在饭局上给薛怜敬酒时，毕恭毕敬的谄媚笑容。他的表情管理非常出色。太出色了。可恶的装货。你偶尔会想杀了他。","","然而，不是所有人都能面无表情地处理尸体。你瞥了眼铁锨都抓不稳的李光辉，对丁凯奇的好感又增加一层。待你把死者衣物剪开褪净，丁凯奇戴好手套、就地捡了几块石头，尽可能对死者面部进行破坏，并砸碎了部分头骨。","","“头发很难分解的。要不我们烧掉吧。”丁凯奇顺手将两块小石头塞入死者软烂凹陷的眼眶，随后抬眼同你对视。视线交织，由于对方没有表情，你不确定他是认真的还是开玩笑。","","“荒岛求生是吧，搞点明火和烟雾，生怕别人看不见你？”","","“我特意带了打火机，只烧衣服也可以。”","","“你的火技能有时空限定吗？必须现在用？”","","“天气预报说下周有雨，尸体可能被冲出来。”","","“所以把坑挖深是为了健身？”","","“那如果……”","","“我求你了，埋个人哪来那么多事儿？写侦探小说的来了。把铲子拿上，过来跟我俩一块儿挖。”","","丁凯奇拎起一把长锨跳进坑里，沉吟片刻：“你说分尸会不会效果更好？”","","“光辉。要不把他也埋了吧。”","","“我？我吗？确定吗……？”","","不愧是李光辉。光辉惶惑的神情，成功让你和丁凯奇相视而笑。为了避免丁凯奇的絮烦唠叨，在这之后的许多年里，你再没制造过如此简陋的案件。"],"chars":742,"docx":"18-※-杨天一.docx"},{"id":"19-♡","no":"19","sym":"♡","key":"李光辉","kind":"mem","view":"韩彬","paras":["春末。宜州进入连绵的雨期。雨水带来霉变。衬衫总也晒不干，挂在阳台上安静地发霉。洗漱间隙，你将它们打包丢掉，仿佛丢掉一簇火。","","同样款式的红衬衫，你统共有十几件。","","人类需要事物来锚定自己。你喜欢红衬衫，因为红光具有强烈的穿透性。那是你衣柜中除了黑白灰之外唯一的两色。你每天穿套装上班，红衬衫穿在内侧、藏在灰西装和黑领带下方，只露出胸口的一处红。有时你会想象，那是你的一颗心。你将一颗心藏在深处，等待她来发掘。","","……这样想是不是太奇怪了？太奇怪了。","","然而你无法停止。你爱她。无关性别，也无关乎形容。你只是强迫自己记住一切，比如她左侧眉尾的小痣，比如她右手中指的疤痕。那时她读书时积成的茧。据说她曾试图以裁纸刀挑破，直到粘稠血液淌满掌心。鲜红、是鲜红色，将答题卡填涂成一片狼藉。","","嗡——","","屏幕显示了来电人。是李光辉。你感到一阵眩晕。没办法，你得面对自己的过失。就算李光辉踩在你的办公桌上耍无赖，就算他发誓不会做任何多余的事，就算珀涯和凯奇带他一块儿，你也不该派他去见杨天一。","","嗡——","","现在你要自食其果了。也许杨天一已经逃跑了。在旭总发现之前，你得调用一切可调用的资源，尽量将他抓回来。也许交给警察？不，不行。不能让阿杰知道。只能用旭凌的人。事情发生在昨晚，现在只过了几个小时。他不会跑得太远——不，他不会逃跑。他得留在宜州。他的目的是钱。在宜州找一个人，对你来说并不难。没问题，你已经做好心理准备了。","","嗡—","","你接通了电话。","","“怎么了。”","","“喂、喂？韩秘书吗？呃，我有件事跟你讲。”","","“……所以怎么了。”","","“韩秘书，你、你听我说。你得相信我。我发誓我什么都没干！但是、但是，是我姐、我姐和凯哥……”","","“……和凯奇？”","","“对。是、是凯奇哥。他俩、他俩把杨天一捅死了！我事后想了一下，就是……这、我觉得、我、我觉得应该……你、你要不要请示一下……请示一下、左总？我发誓这跟我没关系！我真的没动手！但是……我……”","","眩晕消失了。","","杨天一死了。这是最好的结果。虽然过程出了问题，至少你得到了最好的结果。现在你不需要去找杨天一了。他再也不会逃跑了。他会安静地、安静地待在某个角落，再也讲不出多余的话。","","“嗯。我知道了。还有事吗？”","","“没、没了。……我就是要说这个。”","","“那我挂了。回聊。”","","你挂断了电话。通话界面消失。屏幕停在魏来发给你的短信：","","你订婚了？为什么不告诉我？等着吧，我要弄死你。"],"chars":963,"docx":"19-♡-李光辉.docx"},{"id":"20-♡","no":"20","sym":"♡","key":"何晓轶","kind":"mem","view":"韩彬","paras":["魏来染上抽烟，是在初中。零零碎碎的三五人、躲进开水房的锅炉间。劣质烟草混着潮湿的煤灰味与铁腥气，囫囵着吸进去，五脏六腑转一圈、再呼回至霉热的空气里。","","“操、也就还行吧。”对于香烟，魏来只有这一种评价。她仍然会抽完一整支，再将烟头捻灭在指尖。许多年后，她还会记起锅炉房的烟雾缭绕。并不因为那代表了青春。她只是觉得诧异。她曾在锅炉房抽过上百支烟……","","她竟然从头至尾没被炸死。","","“为什么告诉我这个？”","","你几乎被魏来绕进去了。你只是想劝她戒烟，为什么聊到了初中？她总是这样，自顾自地聊起几万年前的事，将一切无聊琐事套上浪漫化的滤镜，反而忽略了真正的痛苦。","","比如她当年在你舌面上灭烟。","","疤痕至今清晰可辨。","","“我只是在描述自己的抽烟史。你听完这个故事，竟然没有触动吗？”","","“我能有什么触动？你在我家抽烟，只有烟雾报警器会触动。”","","“我靠，你简直有病……我是在阳台上抽的！这是我本月的第一根烟，你就不能让我舒舒服服抽完吗？我全公司都被旭凌收购了，现在连根烟都不能抽？”","","“阳台上也会有味道。晓轶不喜欢。”","","魏来将烟掐灭，劈手甩在地上：“你还有脸提晓轶？订婚为什么不告诉我？先不说我和晓轶的事了，我就问你，你他妈的，当初绑架了人家，现在又要跟人家结婚？你恶不恶心？嗯？你觉得自己很深情？”","","“绑架？我什么时候绑架——”","","“哦，现在装失忆了？她爸是宜州的钉子户，你敢说自己不认识吗？”","","“她父母都离婚了，我没见过她父……啊，她、她是……”","","在吵架这方面，你永远赢不过魏来。你明白她指的是哪件事了。你以前怎么没想到过？她也姓何，你早该猜到的，只是你从没想过、没想过如此精致的巧合。晓轶会怎么想？她一直记得吗？为什么她从没提过？她会怎么看待你？她……她会觉得受伤吗？","","现在你有两件事理亏了。","","一是抢走了魏来的女友，二是绑架过何晓轶。","","你尝试为自己开脱，毕竟……毕竟你分辨不出人类的长相。即便是无比重要的人，你也只能拆出碎片化的细节，再一遍又一遍反刍记忆。魏来能够成为你十几年的朋友，很大程度上，得益于她标志性的发带和唇环。","","鲜红色的、鲜红色的发带。","","亮红色的、亮红色的唇环。","","红色是极具穿透性的颜色。你不需要辨认魏来。她永远与众不同。你不记得年轻时的晓轶……你讨厌高中生。标准化的发型、标准化的校服、标准化的死气沉沉。你那时跟她讲过话吗？讲过什么？你没有印象了。你只是隐约记得某个事件，仿佛以第三人称旁观自己的过去。","","你哑口无言了。","","魏来挽了挽袖子离开阳台，大大咧咧将自己扔在沙发上。","","“……我真想掐死你。都怪他妈的旭凌，把你搞得一点人味儿都没有了。我就是贱，到现在还来找你，还上赶着把你当朋友。人家许应杰多聪明，你一进旭凌，立马就跟你绝交了。我怎么就、怎么就……”","","你明白她的意思。你太软弱，她无法狠心割舍你。她需要软弱的你，去衬托自己的强势。无论被她怎样对待，你都学不会恨她。哪怕她的公司在与旭凌竞争中落败，至少她还能从你身上，获得微妙的优越感。所以你才不敢通知她，自己与晓轶订婚的消息——软弱的你竟能得到晓轶的青睐，这一定深深触动了她的自尊。","","她才是那个被触动的人。","","“你俩聊完了吗？”在短暂沉默中找到机会，韩清从玄关探出头来，“我刚回来遇到晓轶姐在楼下，她说不上来了，叫你俩直接下去，咱几个晚上出去吃饭。要我说，吵两句差不多得了，咱这都一家人……我操你先别！”","","魏来抄起抱枕直直飞过去。韩清果断夺门而出，你披上外套追出去，魏来也拎着大衣赶上，几个人在电梯口混作一团。直到踩进电梯，才发现你们只穿了拖鞋。魏来以笑骂催促你开门，并大发慈悲地给予你口头上的原谅。","","“算了，看你总是这么弱智，我都不忍心骂你了。”"],"chars":1466,"docx":"20-♡-何晓轶.docx"},{"id":"21-※","no":"21","sym":"※","key":"许应杰","kind":"mem","view":"李珀涯","paras":["你举枪对准许应杰，接连扣下扳机。","","你甚至不需要认真瞄准，只是随意地连开四五枪。","","在许应杰倒地的瞬间，一个虚影已扑到你面前，钳住你的脖颈，将你狠狠摔在地上。后背被膝盖顶住，你强忍疼痛拼命去寻找唯一的救命法宝，你的枪……","","你的枪不在手里了！","","“凯哥，凯哥你先放开她。你听我说——”","","是李光辉的声音，从房间更深处传来。你被压得抬不起头，只能靠声音判断情况。李光辉的声音停在原地。他一定是被枪吓住了。","","“我明明把他的行动都发给你们了，你们为什么不跑！他要找的是杨天一，就算跟他打照面也无所谓，为什么要杀他？……为什么非要杀他！”","","丁凯奇的声音从头顶传来。他压住音量，夹杂着短促的咽音。李光辉咬着牙回应，声线发抖。","","“凯哥！杀许应杰是旭总默许的。许应杰必须得死。他今天是一个人来的，只有你知道他要来这儿。如果他抓不到杨天一，你解释不了——你、你先把她放开，我求你了凯哥，我们这么多年交情，你要因为许应杰跟我们翻脸吗？”","","身体上方的压制松开了。你踉跄着爬起来，李光辉伸手拉了你一把，将你护在身后。","","“凯哥，我知道你和许应杰关系好……可是……姐、姐你也说句话呀！”","","喘匀了气，你终于有机会打量起对面的丁凯奇。碎发凌乱地盖在眉骨下方，他下半张脸依然没有表情，只是嘴唇在颤抖。卡其色衬衫已经被血浸透大半，湿漉漉地贴在身上……他身上有血？","","“不好意思，我有点应激了。是许应杰先掏枪的。我以为……”你被勾起一丝恻隐之心，嘟囔着向丁凯奇道歉，“我以为他是来找光辉的。但是没事，我的枪是自制的，没有编号。你可以拿走。”","","你死盯着丁凯奇掌心攥紧的手枪。对峙片刻后，后者举枪朝墙，子弹打空，枪被丢在地上。","","“你们走吧。我要报警了。”"],"chars":687,"docx":"21-※-许应杰.docx"},{"id":"22-♡","no":"22","sym":"♡","key":"许应杰","kind":"mem","view":"韩彬","paras":["“韩秘书，你也知道，我姐死要面子，不会低头的。你跟凯哥好好打商量，叫他别生气了嘛。再说了，我们杀许应杰，左总也知道的呀，他要不点头，我们肯定不会……”","","八二九枪击案后，李光辉收敛不少，就连进你的办公室，也会小心翼翼地敲门。","","“他打你了？”","","“……不、不是，呃，也算是……是吧。”","","李光辉移开视线，低声嘟哝了几句。","","没关系的，你在心里安慰他，输给凯奇并不耻辱。","","宜州检察院向来武德充沛。前有薛怜，后有凯奇，早年都是恶名显赫的街孩子。","","所谓街孩子，是宜州人对小混混的代称。街孩子的年龄多在三十岁以下，以未成年为绝对主体。他们多因种种变故无法上学，又在当地找不到工作，故而各自成群，每天在街上游荡。这些孩子再大一点，就要搭客车涌入宜州市区，成为新生的乞丐、扒手或工人。","","薛怜是所有街孩子的顶点。传言中，他不仅阴郁狠毒，智力也非比寻常——在结党打架的间隙，他竟然抽空考上了召亭三中。虽然期间因旷课险被开除，然而李胜利死后，他隐退江湖，回到学校潜心念书。再回到宜州时，他已经是一名检察官了。","","凯奇就更不用说，一米九几的个头，光是重量级就胜人一筹。胜李光辉两筹。","","“我没什么办法。你要是怕了，就把许应杰复活吧。”","","“韩秘书，我没开玩笑！我是真心认错了！而且、而且我又没杀人！是我姐动的手！你们干嘛都怪我啊？我就是个传话的！”","","“你没杀人，为什么吹嘘自己杀过人？”","","“我……什么？！”","","李光辉从地上弹起来。你很欣赏他瞠目结舌的表情，自许应杰死后，你第一次笑出声来。这有什么好笑的？这太荒谬了。悲伤是一种沉重的感情，笑却是轻盈的。你没有力气悲伤了。如果爱人知道发生了什么，她也会笑的。好想见她。你已经订婚两年了，结婚依然遥遥无期。工作已经够忙了，你还得处理这姐弟俩的烂摊子。这个世界对正常人太过残忍了。是的，你坚信自己是正常人。","","“韩秘书，连你也不相信我吗？我没跟他讲过杨天一的事！我是为了吓唬他才说的，他游戏打的太烂，我、我那时候喷他喷上头了，谁知道他真会开我的盒？我、我就是吹一下！韩维恩不会指控我的！不会的……吧。”","","“没人指控你。许应杰也没有指控你，他只是想见你。”","","“为什么？”","","“谁知道呢。你可以复活许应杰，自己去问他。我要去开会了。回见。”"],"chars":901,"docx":"22-♡-许应杰.docx"},{"id":"23-※","no":"23","sym":"※","key":"丁凯奇","kind":"mem","view":"李珀涯","paras":["自许应杰死后，你和丁凯奇陷入了微妙的冷战。冷战的特点是对抗与缓和交替，你与丁凯奇的关系也是如此。有需要面谈的情况，他会屈尊坐地铁来找你，或者你骑摩托车去找他。除此之外，你们没有更多联系。","","坦白讲，你对此极其恼火。许应杰的死是左旭升默许过的，丁凯奇的迁怒简直毫无道理。虽然你也确实犯了错，比如不小心打中了丁凯奇……可他又没死！不就是打了他一枪吗？你可是实打实被他扔到地上了！他至今都没道歉！","","也正因此，对于丁凯奇的死，你深感空虚。这并不意味着你喜欢丁凯奇，恰恰相反，尽管李光辉无数次企图撮合你和丁凯奇，但你确实对他缺少激情。在你看来，倘若没有检察官和杀人犯的光环，丁凯奇只是个模样漂亮的人渣。你常年期待他死于某种猎奇荒诞的谋杀，而不是莫名其妙从阳台掉下去摔死。","","怀着这种心情，你参与了对范泽的询问。","","“你和丁凯奇是什么关系？”","","“算是情侣吧。还没有正式确立关系。”","","情侣？别开玩笑了，丁凯奇讨厌她这种畏畏缩缩的类型。你见过他所有前任，他的取向一直是阳光开朗大小姐——把阳光吸干再断崖式分手。","","“说说昨晚的情况。”","","“我当时在洗澡。洗完澡出来，他不在客厅。我给他打电话，发现他手机还在沙发上。我就坐在沙发上看电视，以为他是下楼了。过了一会儿，听见楼下有人乱糟糟地喊，才知道他是掉下去了。”","","拙劣的谎言。丁凯奇的手机上有她的指纹。阳台窗户上也有她的指纹，客厅的矮脚木椅上也有她的指纹。你几乎脑内还原出她的杀人手法了。","","你没有问出口。你不想在审讯室暴露自己的怀疑。反正她肯定也会说「我只是开窗透透气」。","","“然后呢？”","","“然后我就回家了。 ”","","“为什么？你们不是暧昧关系吗？他死了你就正常回家了？”","","“我也不知道……就是害怕吧。”","","谎言。还是谎言！你暗自愤懑着。她怎么会不知道？尸检报告显示，他死前拼命想攀住窗框，右手指节都磨出了血，她竟然说不知道！","","“事发当时，你有没有听到他的声音？”","","“没有。浴室的水声很吵。可能他叫过我。我当时什么都没听到。要是我听到就好了。”","","你的确不认为丁凯奇会撕心裂肺大喊大叫，然而你清楚地知道，昨晚现场勘察时，浴室地面是干的，热水器也没有使用痕迹。要不是碍于身份，你真想狠狠给她两耳光，逼问她为什么要……算了，想杀丁凯奇是人之常情。你深吸一口气，告诫自己不要发作。","","“对于这件事，你有什么看法？”","","“我真的什么都不知道。昨天是他约我出来的，我这里有聊天记录。你看，他说想见我一面。”","","聊天记录如果可信，你早就是光明会的首脑了。无论她再怎么辩解，都不可能打消你对她的怀疑。你不相信丁凯奇会死得如此草率，正如你完全不相信范泽的任何证言。","","讯问结束后，你大发慈悲放她回家。","望着她的背影，你暗暗下定决心。","","一定要给她定罪。一定要。"],"chars":1098,"docx":"23-※-丁凯奇.docx"},{"id":"24-○","no":"24","sym":"○","key":"麦子期","kind":"mem","view":"薛怜","paras":["“幸会幸会，我叫麦子期。久仰大名啊薛检，我在禾港都听过您的赫赫威名。自打你到宜州，整个城市都焕然一新啊。”","","“您过誉了。比不上您奋斗在一线。介绍一下，这位是韩维恩。”","","“不用介绍了，小维嘛，我们认识。我还有他电话呢。这小孩前两年老是盗别人游戏账号，把人家搞得报警了，被我教育了一下，直接就善堕了。”","","“是吗？还有这种事？”","","“……没有。我现在不玩那个了，没意思。”","","“怎么说，薛检，让小维跟着我吗？”","","“具体您自己决定吧。您知道同组还有谁吗？”","","“知道，是个做刑技的，刚好是我大学同学。说来也挺巧的，我们大学时候还有个组合呢，叫高山流水。现在想想也多年前了。”","","“您信得过就好。范泽的事您了解过吗？”","","“大概知道，她之前在禾港也报过警，不过当时没立案。她给你写举报信了吧？几年前有个姓许的警察也找过她，后来没信了。对了，我听说她有枪？真的假的？”","","“真的！麦哥，是泽姐亲口跟我说的！她还说要拿枪去杀了韩彬和左旭升。”","","“哈哈，还挺厉害的。那她人呢？”","","“不知道。我好几天没见她了，手机也关机了。不过我查到了关机前最后出现的地点，已经确认是李光辉的住处。”","","“李光辉？哦，好像有印象……所以我们得顺便去控制李光辉？”","","“是这样吗，薛检？”","","“差不多吧。还是以你们的核心任务为主，有余力的话，尽量找到范泽，然后控制住李光辉。麦警官，你稍后留一下，我有份文件要传给你……解释起来很麻烦。先这样吧。”"],"chars":581,"docx":"24-○-麦子期.docx"},{"id":"25-※","no":"25","sym":"※","key":"韩维恩","kind":"mem","view":"李珀涯","paras":["说起来，新星小组这个称呼，还是你从韩彬口中得来的。新星？听起来简直是厕纸小说的厕纸命名法。你已经28岁，中二病的时代一去不复返。","","当你直白地提出这个问题时，麦子期正招呼服务员，要求先来五十串烤五花、五十串烤牛肉、二十串烤鸡翅和十二串烤鱿鱼；韩维恩则小发雷霆，并不坚决地抵制其奢靡铺张、气焰嚣张和自作主张，毕竟落座前两人已经敲定，今晚由韩维恩请客。","","“所以为什么叫新星小组？土得要死。”","","“我们名义上属于新星法律咨询事务所，所以内部会这样称呼。仅此而已。”","","韩维恩在第一时间回答了你。与麦子期相比，他的外表相对更年轻。太过年轻。你不得不问出那个问题：“你不会是初中生吧？”","","“……不是。我成年了。”","","“哦……哦。”","","你摆出一副了然的神情。考虑到社交礼仪，你不再问下去。麦子期将硬卡纸材质的菜单递给你，你顺势转移话题：“你找到住处没有？宜州租房挺方便的，纯线上就能签合同，不用跟房东和中介见面。”","","“还真是，本质一键租房了。你都不知道，我之前在禾港租房，被人骗得狗一样团团转——”","","“千言万语、桥洞等你。禾港疑似真没人了，连某些混子都能参加项目。但使禾港飞将在，不教马鹿渡宜州了。”","","“错误的。你这种搞刑技的就是不懂实践。没了我、就剩你和小维孤儿寡女，杨天一杀过来怎么办？好不容易高山流水再聚首，我是怕你英年早逝。”","","“我英年早过了，大不了一死。反正大器晚成者少，大器没成者众。杨天一再厉害也是人，人类就是一大块行走的五花肉，加点孜然就端上烤架了……”","","你一边同麦子期闲扯，一边在菜单上打钩。你不记得自己点了什么。人类的记忆不可能面面俱到，你的回忆也仅仅包含“你曾注意到的事物”。这之后的记忆无法读取。你拼命回忆，只能联想到模糊的音频。你听见韩维恩在唤你的名字、小声劝你别喝了，背景音是麦子期猖狂的笑：","","“哈哈！你喝太慢了——我赢定了！”"],"chars":754,"docx":"25-※-韩维恩.docx"},{"id":"26-♡","no":"26","sym":"♡","key":"范泽","kind":"mem","view":"韩彬","paras":["“威胁我是没用的。我已经没有软肋了，大不了你杀了我，你敢杀我吗？就算你杀我也没用，我的举报信已经递到检察院了。告诉你，我还联系到了旭凌绑架案的受害者。你所做的一切，迟早都会付出代价！”","","“范小姐，这并不是在威胁您，只是商量。这样闹下去，对您没有任何好处。您有什么诉求，可以直接反馈给我；对旭凌有任何意见，我们也悉心听取，没必要讲这么极端的话。”","","“极端？你觉得我极端？好啊，我还有更极端的。我告诉你，我不仅有旭凌集团绑架未成年的证据，还有左旭升杀人的证据！你就尽管赖账吧。我一定会把你们告到死！”","","左旭升杀人的证据？这倒是第一次听说。","","你对范泽的印象第二次改观了。","","第一次改观，还得追溯到她持枪逼死了凯奇……又是杀人案。你讨厌这种滥杀的风气。似乎杀人是理所当然的。别开玩笑了。死亡是人生中唯一严肃的事，它永远无法被消解。你偶尔会享用他人的劳动成果，但这不代表你对生命没有敬畏之心。","","你对人类是抱有感情的。在遇见爱人之前，你也曾爱过许多人。你爱过许应杰，爱过丁凯奇，爱过自己的家人，或许还爱过魏来。人类是社会性动物，人类的本质就是社会性。人是关系的集合体，也是爱的集合体。杀人所摧毁的不仅是肉体，还有附着在肉体之上的关系网，以及附着在肉体之上的……爱。","","“一定要这样吗？范小姐，您还年轻，人生还有无限可能。过去的事，就让它过去吧。对于令堂的悲剧，我也同样难过。与您一样，我从小也没有母亲。我完全理解您的痛苦，希望您不要走上偏激的道路。我相信，如果您的母亲还在，也一定希望您走出阴霾，迎接自己的生活。”","","其实你跟她不太一样。","","至少你的母亲没有被杀死在野外，腹腔被凶手掏空。说起来，魏来尤其喜欢这种猎奇元素。待一切尘埃落定，或许你可以把这个故事讲给魏来。你会告诉魏来，孤身一人的范泽如何回到宜州，如何展开她的复仇……还是算了，情节一经概括，就显得俗套。","","你没有说服范泽。她维持着戒备的姿态，随时准备将你们赶走。当年你去跟何家谈判，似乎也是类似的情况。何家至少有个女儿。范泽已经一无所有了，你找不到任何突破口，何况她还有一把枪——至少她声称如此。","","“好吧。那我们就不打扰了。如果您改变主意，可以随时联系我。”你没有递上名片，只是把电话号码潦草地写在纸片上。她没有接。","","韩清起身跟随你离开，你们在门口分手：“我得回公司了。小清，你跟我一块儿吗？”","","“不了，我还有点事。你不用管了。”","","自此之后，你再没见过活着的范泽。"],"chars":989,"docx":"26-♡-范泽.docx"},{"id":"27-△","no":"27","sym":"△","key":"范泽","kind":"mem","view":"何晓轶","paras":["你应该畏惧尸体吗？不，不会的。你见惯了尸体。你不止一次参与过解剖。所以，人类只是……只是……","","不，不对。你杀了人。你杀了范泽。她栖在自己的血泊中。血泊中长出一簇簇血肉。你的心脏坠坠地痛。有人在看你吗？有人在盯着你吗？有人发现了你的劣行吗？……有人在看着你！你能感受到审视的、冰冷的目光，一寸寸掠过你的身体。","","你一定被发现了！","","你踉跄着逃跑。你逃进车里。打火、打火、打火！你连打了三遍才发动引擎，踩住油门疾驰离开。车辆逃出昏暗的破旧街区，将漆黑的真相远远抛在身后。余光是什么在闪烁？是金属的提手，光滑布料的反光——","","背包。","","范泽的背包。","","是范泽的背包！","","它静静地躺在你的副驾上。你应该早点发现的。你完全沉浸在杀人的激动中。她下车时忘了背包吗？你毫无印象了。人类的注意力过于狭隘。你、你得丢掉它。你得丢掉它。将它丢在哪儿？你正行驶在马路上，你怎么能……","","红灯。你停在十字路口前。不行，不能现在丢掉。马路上会有监控，你的车牌号会被拍到。你只能一直带着它。好，先带回家、先藏在家里吧。一切从长计议。一切从长……","","已经没办法了！哪有什么从长计议！她的尸体躺在街道口！也许等不到明天早上，也许今夜、今夜就会被人发现！你不该冲动的！就算、就算她杀了丁凯奇又怎样？你跟丁凯奇本来就不熟！就算她想杀……","","不，不行。你是对的。你得杀了她。她藏了一把枪。你不能放任她在宜州杀人，你不能放任她威胁到……","","绿灯了。事已至此，还是先回家。先把范泽的背包藏在家里。没关系，一切都会解决的……不要、不要紧张。毕竟这里是宜州……这里是旭日之下。"],"chars":644,"docx":"27-△-范泽.docx"},{"id":"28-※","no":"28","sym":"※","key":"麦子期","kind":"mem","view":"李珀涯","paras":["在李光辉的出租屋，你找到麦子期的尸体。自从范泽死后，这是你和李光辉首次见面。你翻找了范泽留下的背包，把她的身份证揣在身上，预备联系下家卖掉。抬眼，麦子期的尸体还在原地。","","你叹了口气。","","“怎么搞的？他是禾港来的警察，处理起来很麻烦的。”","","李光辉坐在沙发上咬指甲：“可他、他……他问我南堤口的事！”","","“……什么意思？”","","“我也不知道。但是他问得很笃定，仿佛他知道死的人就是杨天一。当时境况只有我们三个知道，你在警局也没见到线索，他怎么会找到我呢？”","","这不是废话。话没套完就把人杀了，当然是什么都不知道。你逃避了这个问题，低头开始刷手机，发现韩维恩更新了文档。……说实在话，他最近写的文档你已经没在看了。别说看文档，你连赵烁的询问都没做。你随便挑了最新的一份。","","……？","","“他给外面打电话了？”你瞪了李光辉一眼。","","“不、不是，他跟我差不多高，我怕打不过他，就想先把他头敲昏，然后去厨房找刀。回来发现他已经醒了，一边往阳台爬一边打电话，我就给他挂断了。最多打了半分钟。而且他也没报警。”","","打给韩维恩，也跟报警没区别了。你气极反笑，循着韩维恩的文档，还真找到一点线索。","","“我们审杨天一的录音被他拿到了。”","","“被谁？”","","“他。”你脚尖踢了踢麦子期的尸体，深吸一口气，安慰自己韩维恩不是正式警员，手头也没有实打实的证据。没有你这个上级的书面签字，他不可能调来本部的警力。再者说，以韩维恩的体格，要制服李光辉？简直天方夜谭。退两万步说，你印象中的韩维恩，是个一板一眼的小孩。这种人是不会贸然行动的。绝对不会。","","总而言之，你只要等他来找你就好。如果事态紧急，他会给你打电话的。","","应该会的。","","“录音？不应该啊……按理说应该只有凯哥有的，顶多再给薛检发一份。凯哥和薛检总不能举报自己吧？”","","“死人做什么都有可能。怪不得范泽和丁凯奇必须在家里见面。也许就是为了那份录音。”","","“那现在怎么办。去把跟他打电话的人也杀了？反正那个也是你的人。”","","“什么年代了还在杀杀杀……你三岁吗？本来就已经够烦了，范泽还被四眼逼得跳了河，简直人渣和弱智同频共振。先把他弄冰箱里去，再找个地方吃饭吧。边吃边想办法。”","","“我想吃方便面。我们待会儿去楼下711吧。”"],"chars":887,"docx":"28-※-麦子期.docx"},{"id":"29-※","no":"29","sym":"※","key":"韩彬","kind":"mem","view":"李珀涯","paras":["作为受害者之一，你怀着愤怒阅读报道自己事故的新闻。这群弱智，竟然把你当成了范泽！他们都没长眼吗？就因为你身上有范泽的身份证，你就是范泽了？虽然你可能跟范泽长得是有一点点像……无论如何，这简直不可容忍！比李光辉的死更不可容忍！","","术后疼痛还在折磨你，但你已无暇顾及。","","思考。冷静思考一下。到底为什么会走到今天这一步？为什么韩维恩会开车撞你？——不，不是冲着你。他是去撞李光辉的。那就更奇怪了。为什么要杀光辉？他们之前认识吗？韩维恩是禾港来的，他怎么会认识李光辉？","","等等，他是禾港来的。在最近的事件中，还有谁是禾港人？","","是范泽！范泽也是禾港来的！虽然不确定具体手段，你认定她杀了丁凯奇。如果她和韩维恩是一伙的……再杀了丁凯奇之后，又要杀李光辉？他们的共性是什么？难道因为你们杀了杨天一？不、不对，这件事没人知道。也许有更宏大的原因……","","**复仇**。","","范泽是魏娟的女儿。先杀了薛怜手下的丁凯奇，再杀了左旭升手下的李光辉。就是这样！你感到豁然开朗，仿佛生理疼痛也一并减轻。一切都说得通。她是为了复仇。为了给魏娟复仇。韩维恩是她的同党。他没有杀你，因为他不知道你也是左旭升的人。","","你理解了一切。你失去了人间的至亲，你也该向范泽复仇了——可是她已经死了！在你认清真相前，她已经淹死在河里了！她怎么敢去死！这个贱人！","","在愤懑的余韵里，你注意到病房的门被推开了。","","是左旭升带着秘书来看望你。","","你的愤怒终于有了确切的出口，于是你咬牙切齿地指证了罪魁祸首：“都是这个韩彬非要节外生枝！兜兜转转一大圈，不该死的人都死了！”","","“小韩，你也参与了？”","","“旭总，我并没有参与执行……我只是建议让杨天一暂时消失。”","","“建议？光辉年纪小，他当成命令怎么办？一会儿回公司，你看我怎么教训你！”","","“抱歉，旭总。”","","“珀涯，你先别生气，我回去替你狠狠骂他。你告诉我，到底是怎么回事？从杨天一的事开始讲。慢慢来，累了就先歇一会。”","","“小叔你放心，我现在全都想起来了。这件事最早是四年前，杨天一回宜州打听你的消息，还往你公司里打电话，被韩彬接到了。姓杨的知道你现在有钱，想拿当年的事勒索你，说他手里有证据。韩彬让光辉把他打发走，光辉以为是要杀了他，他不敢动手，把这事告诉我和丁凯奇，我们三个就把他约到南堤口，搞明白情况后，我俩就把他捅死了。”","","“你俩？”","","“我和丁凯奇。光辉不敢的，他就是帮着把人埋了。”","","“小韩！这种事你让光辉去办？”","","“抱歉，旭总。是光辉他——不，是我考虑不周。”","","“……你等着吧。珀涯，那录音是怎么回事？”","","“录音是丁凯奇搞的，他说要发给薛检。我一想也正常，薛检毕竟是他的直属上级，也是我们自己人，丁凯奇肯定要跟他报备。他发完我就盯着他删了，连云端记录都检查过了。肯定是他偷偷搞了备份，私下传给了范泽。这个贱人！活该他死了！”"],"chars":1131,"docx":"29-※-韩彬.docx"},{"id":"30-♡","no":"30","sym":"♡","key":"李珀涯","kind":"mem","view":"韩彬","paras":["“……然后过了两年，尸体被挖出来了。警局都不想查这个案子，先并到杨天一的案子里去了。许应杰不知哪里得到了证据，认定了死掉的杨天一，还想往光辉身上查。当时监视他的是凯奇，知道他去过两次禾港，跟江恒生也见过。”","","“小韩——”","","“旭总，得到珀涯出事的消息后，我马上把江恒生控制住了。具体情况还在审。范泽的尸体几天前在河里被发现，结合检察院之前有意向对范泽提起谋杀指控，警方目前倾向于畏罪自杀。”","","你已经习惯说谎了。几天前，你面不改色地将范泽的背包交给李光辉，顺便转告他和珀涯，范泽被江恒生追得太紧，掉进河里淹死了。其实不应该推给江恒生。不过也没关系，至少她掉进河里是真的。江恒生会很识趣的。韩清已经跟他玩过几次剪刀石头布的游戏——韩清一直出石头，直到他喊布。","","“好。珀涯，你继续说。”","","“他一回宜州就开始找光辉，光辉就找我帮忙。前几次是丁凯奇通风报信，一直没和许应杰打照面。警局这边我也尽量把他的线索先压住。但他毕竟级别比我高。虽然许应杰在警局人缘不好，可要是他私下汇报就糟了。我就弄了把枪，等他顺着监控找到被服厂，在厂里几枪给他打死了。后面的事你也知道，有丁凯奇作证，案子推到杨天一身上了。你都不知道，为杀许应杰，丁凯奇跟我俩生了好大的气。”","","“生气？”","","“旭总，许应杰是丁凯奇的……朋友。凯奇毕竟是年轻，对朋友看得很重。我已经开导过他了，凯奇也对此表示理解。他绝不会因为许应杰叛变的。”","","许应杰也曾是你的朋友。朋友是个沉重的词汇。滥情的丁凯奇也会在乎朋友吗？说来可笑。答案竟然是“YES”。可惜他已经死了，他只能任你解释。死亡是一件严肃的事。人一旦死亡，就再也无法反抗他人的评判了。","","“这次呢？”","","“还不是为了丁凯奇的案子！虽说没立案，但好像是检察院有压力，所以局内搞了个小型调查组。我正好也觉得范泽有问题，就自己请缨了。麦子期和韩维恩都是禾港调来的。麦子期老家也在宜州，我大学就认识他，后来他去搞经济犯罪了。麦子期是个懂行的人，就算知道点什么，也不会大肆张扬。韩维恩是麦子期带过来的，我之前不认识。”","","“那怎么查到杨天一身上了？”","","“我怎么知道？！这俩人查着查着就往那边去了。麦子期才怪呢，就刚开始交了询问几份录音，后面就完全找不到人了，再往后就是查到光辉这边，光辉吓坏了，就把他给杀了。韩维恩还好点，至少把丁凯奇的事查清了，而且事事都会写档案……我的档案系统怎么打不开了？……算了，他也没好哪儿去，这死小孩竟然敢撞我！”","","“小韩？”","","“旭总，根据看守所的讯问结果，韩维恩供述自己是喝多了，不小心撞进便利店的。虽然他驾驶的车辆产权上属于麦子期……大概率会以酒驾过失来结案。另外，根据我们的调查，韩维恩并不是调查组的组员。他只是来宜州旅游的大学生，不知怎么跟麦子期混到一起了。”","","“什么！他——他骗我？我怎么会——”","","“珀涯，你先别激动。这件事我们来处理。来，你先躺好。”","","“喂，韩彬。为什么我的手环上写着范泽？”","","“您被送医时，身上有范泽的身份证。现场没有人清楚您的身份，所以……”","","“小韩，你去沟通一下。”","","“抱歉，旭总。我已经和医院沟通过了，今天就能改回来。”","","“那好。珀涯，你先好好休息，有事给我打电话。另外，从今天起，先别联系薛怜了。”","","“薛检怎么了？他也出事——”","","“不，他好好的。你只要记住，他已经不是自己人了。”"],"chars":1340,"docx":"30-♡-李珀涯.docx"},{"id":"31-△","no":"31","sym":"△","key":"魏来","kind":"mem","view":"何晓轶","paras":["“你的意思是，凶手在胡同里砸死了受害人，尸体却从河里捞上来？”","","魏来饭也不吃了，咬着筷子分析情况。她对猎奇故事总是充满热情，你偶尔会给她出这种题目：如果你是小说家，该会怎么设计合理的解释？","","“这个凶手杀人的时候，有人目击到吗？”","","“……我感觉有……呃。我的意思是，可以设定成有人目击到。”","","“那就很好解释嘛。第三方目击者在凶手离开后，把尸体扔到河里去了。”","","“为什么呢？明明目睹了杀人现场，却没有报警，反而偷偷处理了尸体？”","","“目击者是凶手的朋友，或者是爱人之类的，因为不想凶手被抓住，所以帮了个小忙。”","","爱人？……你的爱人当晚在旭凌总部加班。无论如何，他没时间往返于市北区。也许他安排其他人去做。可他怎么知道你杀了范泽？连你自己都没料到，你竟然会成为杀人犯。","","这几天来，你反复安慰自己，你并不是滥杀无辜。你是为了旭凌，为了自己的工作，更是为了这个家。你不能接受自己的爱人被指控，何况范泽言之凿凿地告诉你，她有一把枪。她要用这把枪实现自己的复仇。她已经杀过一个人了。你知道她还想杀谁。","","“可是，怎么会这么巧？偶然路过的目击者，恰好是与凶手相关的人？”","","“如果不是偶然路过呢？”魏来将筷子搁在碗沿上，“比如说，目击者就是一路跟踪过来的。目击者在跟踪凶手，或者在跟踪被害人的过程中，偶然发现了这起案件。为了包庇凶手，顺便将尸体运到河边。这也能解释凶手和目击者互不沟通，因为目击者不想暴露自己跟踪行径，以免破坏自己在凶手心中的印象。嗯嗯。这么一想也挺浪漫的，即使阴湿的跟踪狂，也会竭力保护自己的爱人嘛。”","","有人跟踪你？……不，你没什么特别的。应该是跟踪范泽。你的爱人会派人跟踪范泽？也许吧。毕竟范泽威胁要让旭凌声誉扫地……于是跟踪范泽的人，发现了你杀死范泽的现场。是这个人替你处理了尸体？为什么要冒风险这么做？因为你和爱人的关系？不，你在研发部门工作，他手下认识你的人很少。","","目击者是认识你的人。这个人与旭凌集团——至少与你的爱人——有很深的关系。也许他还通知了爱人。这就是为什么、为什么范泽的背包不见了。你把它藏在家里，它却不翼而飞了。是爱人将它带走了。他知道你杀了范泽，他早就知……","","“晓轶？你怎么了？”魏来用筷子在你眼前晃了晃，“想什么呢？”","","你明白目击者是谁了——你、你完全理解了。"],"chars":928,"docx":"31-△-魏来.docx"},{"id":"32-☆","no":"32","sym":"☆","key":"再见","kind":"mem","view":"范泽","paras":["年末，宜州涌现风声，似乎薛怜就要高升市检察长。","","这也意味着，他就要成为宜州历史上最年轻的检察长。","","媒体们闻风而动，无数篇通稿讲述起他的传奇故事。农村出身的薛怜，从不学无术的街孩子，到如今扫黑除恶的检察官，今年又侦办了召亭连环杀人案和八二九枪击案。前者作为横亘二十余年的大案，直到今天真相才得以揭露，当年的犯人杨天一，也已经死于模仿犯李光辉之手。","","旭凌集团董事长左旭升，为包庇八二九枪击案的真凶李光辉，不惜买通检察官丁凯奇进行伪证。丁不堪心理折磨，于今年六月坠楼自杀。讽刺的是，左旭升绞尽脑汁保下的养子李光辉，也在今年八月末死于一场酒驾事故。此外，左旭升本人被证实与至少两起凶案直接相关，详细案情暂未公布，但民间普遍认为，可能与范泽溺亡案相关。","","目前，左旭升已确认被刑事拘留。","","系列案件也存在争议。部分媒体认为，薛怜与左旭升早年私交密切，应当回避本案。针对以上种种论调，薛怜维持了一贯的低调，从未公开发表过任何观点。","","对于普通人，则是天子跬步而天下缟素的悲壮感。旭凌大裁员的“内幕消息”在各大群聊与自媒体之间疯传，宜州上下游产业链也随之激荡，从工厂到写字楼人人自危。在公开资料中可以窥知，旭凌二字的含义是，无论世事如何轮转，抬头依旧旭日凌空。不巧。这年宜州下了好大的雪，旭日久未得见。","","……感到不甘吗？","","范泽的名字无法在宜州留下印记。然而，屏幕前的人或许会记得。","","是的，你会**记住**范泽。","","**请键入指令，记住范泽。**","","【内部说明：此处玩家键入存档指令，才能进一步推进剧情。】","","感谢你愿意保留记忆。","","无论世事如何轮转，我们一定会在崭新的阳光下再度相遇。","","所以再见了。愿我们后会有期。","","——《请键入指令：旭日凌空》完——","——列表已解锁：伽西莫夫编外谈——"],"chars":713,"docx":"32-☆-再见.docx"},{"id":"33-你","no":"33","sym":"你","key":"伽西莫夫编外谈","kind":"mem","view":"—","paras":["感谢您游玩拙劣的本作。","","本游戏为《请键入指令：始动篇》的续作。本作汲取前作经验，加入了少量操作引导，以及更加人性化的阅读方式，希望能尽可能降低游玩门槛。","","作为一部剧情游戏，本作的缺点显而易见……对巨量文字感到厌倦是人之常情，真的非常抱歉。","","在之后的几部作品中，《请键入指令》系列将在维持终端玩法的基础上，讲述韩彬、魏来与何晓轶三人的扭曲关系，以及范泽与韩维恩的隐藏故事。条件允许的情况下、会加入少量美术素材。","","再次感谢您游玩本作。","","衷心祝您幸福。","","*XHS账号：@i-Quasimodo","网页有任何bug请及时联系。由于现实工作繁忙，消息可能回复不及时，请见谅。*"],"chars":275,"docx":"33-你-伽西莫夫编外谈.docx"},{"id":"P:八二九枪击案","no":"","sym":"▣","key":"八二九枪击案","kind":"arch","view":"档案","paras":["宜州日报讯","","宜州市公安局刑侦支队队员许应杰，在近日追查宜州特大连环杀人案的过程中，于宜州市市北区西关街道被服厂内遭枪击，经送医全力抢救无效，不幸因公殉职，年仅31岁。案件侦办工作仍在进行中。","","据市公安局通报，案发当日上午，嫌疑人杨天一在西关街道被服厂附近被许应杰追捕截停。杨天一持枪拒捕，与许应杰发生交火。许应杰在交火中身中数弹，当场牺牲。杨天一子弹打空后弃枪驱车逃离现场，现场遗留的自制手枪及制式警枪各一支，经初步比对，与涉案弹壳吻合。","","公开履历显示，许应杰同志从警近十年，长期奋战在刑侦一线，曾参与侦破多起大要案件，是宜州公安刑侦战线的骨干力量。案发前数日，他仍带队围绕杨天一团伙的行动路线开展外围排查，连续多日未回家中。","","案发后，省公安厅及市委、市政府有关领导分别作出批示，要求全力做好善后抚恤工作，并彻查涉案枪弹来源及杨天一团伙的关系网。市公安局已成立善后工作组，协助家属处理相关事宜。截至发稿，案件仍在进一步深挖中。","","许应杰同志牺牲的消息传开后，其生前战友、辖区群众自发前往殡仪馆吊唁。许应杰生前好友、宜州市检察院检察官丁凯奇案发时正在现场，亲眼目睹许应杰中弹牺牲，其本人也中弹负伤。在接受采访时，丁凯奇表示，希望案件早日查清，涉案枪弹来源及关系网依法彻查，给许应杰和家属一个交代。"],"chars":541,"docx":"公共记忆-八二九枪击案.docx"},{"id":"P:八二九酒驾肇事案","no":"","sym":"▣","key":"八二九酒驾肇事案","kind":"arch","view":"档案","paras":["宜州日报讯","","八月二十九日下午，宜州市龙江路与中山大道交叉口附近发生一起交通事故。","","一辆黑色本田轿车冲入路边一家711便利店，造成一死一伤。涉事司机韩某恩已被警方控制，事故详细原因仍在进一步调查中。","","据现场初步了解，事故发生于8月29日15时40分许。韩某恩（男，22岁，籍贯江苏宣阳，持C1驾驶证）驾驶一辆黑色本田轿车，沿龙江路由东向西行驶。车辆行至事发路段时，车辆直穿人行道，撞碎711便利店玻璃门后冲入店内约8米。","","店内顾客李某某（男，24岁）在收银台附近遭车辆撞击，经急救人员确认已无生命体征，系当场死亡。另一顾客范某（女，29岁）被撞倒后遭货架挤压，造成骨盆骨折、多处软组织挫伤及失血性休克，已被消防人员救出，紧急送往宜州市人民医院重症监护室救治。截至发稿时，范某仍在进一步治疗中。","","本台记者为您报道。"],"chars":350,"docx":"公共记忆-八二九酒驾肇事案.docx"},{"id":"P:召亭特大连环杀人案","no":"","sym":"▣","key":"召亭特大连环杀人案","kind":"arch","view":"档案","paras":["宜州特大连环杀人案（又称召亭811系列连环案）是指发生在山东省宜州市和江苏省禾港市两地的系列恶性案件，犯罪嫌疑人通过尾随或入室等方式实施随机犯罪，受害人有男有女，犯罪特点为：犯人往往将死者眼珠剖出并破坏其面部特征，随后从死者眼眶向颅中塞入数枚石子。","","以辛家埠杀人案为典型，受害人魏某双眼被挖空并塞入石子，颈部被切开，胸腹被剖开并挖空内脏，下体赤裸，阴部遭严重破坏。截至目前，系列案件共致九名被害者死亡，受害者年龄最小17岁。案件受害者最早可追溯至二十四年前，凶手迄今仍逍遥法外。","","本案关联案件为宜州市召亭县李胜利案。","","距今二十年前，杨天一已累计犯下四起案件。由于上级要求必须在规定期限内“办成铁案”，召亭警方仅根据足迹鉴定结果，就强行逮捕了29岁的青年工人李胜利，并利用刑讯逼供、威胁家人等方式强迫其认罪认罚。在被关押审讯五个月后，李胜利承认犯罪事实。在其亲友及辩护律师的努力下，案件一审宣判无罪。然而，李胜利在一审后仍被超期羁押在看守所。","","次年九月，召亭县辛家埠发生恶性杀人案，经研究认为，该案与前几起案件高度相似，应当合并入召亭811系列连环杀人案。十月，李胜利案在山东省宜州市中级人民法院召开二审，李胜利被当庭无罪释放。此时李胜利已在看守所羁押长达十七个月。有充分证据证明，李胜利曾在看守所内受到严重的不公正对待。年末，李胜利因肺炎去世，留下妻子江云和年幼的女儿（李小小）和儿子（李光辉）。","","在召亭县，李胜利案的影响力远大于连环杀人案本身。该案件导致了召亭县严重的警民对立，当地治安环境也迅速恶化。警方公信力丧失导致民间出现大量帮派团体，这些团体多由社会闲散人员组成。时至今日，召亭县仍然位列山东省经济贫困县。"],"chars":703,"docx":"公共记忆-召亭特大连环杀人案.docx"},{"id":"P:录音文件","no":"","sym":"▣","key":"录音文件","kind":"arch","view":"档案","paras":["转写说明：**本文档系软件自动转写生成，未经校对。** 后续文档整理过程中需二次校对。录音经过多次处理，无法识别音色特征，暂使用编号区分说话人。录音原件已上传附件。","","*以下为正文。*","","①：……那时候小龙给我打电话嘛，说有三个小孩来，我就去找他们。领头的是半长头发的小小子，叫雪莲的，邪得厉害，戌狗和小四眼都听他的。他一上来就掏刀子问我西关的案子，让我去自首，要不然就把我弄死。那我肯定不能说自首嘛，我当时也是杀了四五个人了。然后我套他话，就哄着小孩嘛，才知道是大队里急着破案，把我杀的人给李胜利顶包了。那我一想，雪莲也是街上孩子，他自己手上犯过事，不敢去找警察。我就跟他好商好量，他说让我再到外面杀两个人，还是把眼睛挖了，这样警察知道人抓错了，李胜利就放出来。我说那也行，就带他们几个去辛家埠蹲着等人。晚上的时候有纺织厂下班的，就看着机会把一个女的抓到坡下面捅死了。","","②：谁做的？","","①：杀人主要是我。雪莲是小小子嘛，他去跟人搭话，女的不害怕。她一过来我就把她抓住，雪莲出去望风了。我把人拽到坡下面捅了几刀。","","②：为什么要把内脏挖空？","","①：就那个女的，刚开始一直叫嘛。她一叫，四眼就上劲儿了，脱裤子想搞她，她淌血淌得快不行了，由着他搞。雪莲过来把四眼训了一顿，说警察能验出来。我就拾了两根木枝子，把下面弄烂了，雪莲觉得还不保险，把肚子也挖开了，脏器下水拿衣裳兜起来扔在河里了。","","③：雪莲也动手了？","","①：后面都是他动手。小小子自己有刀，把尸首脖子割了，头也砸烂了。","","②：其他两个人呢？","","①：雪莲回来，就换戌狗去望风了。小四眼不敢做事的，再说雪莲一直跟他发火，说是被抓了第一个弄死他，小四眼就不说话了。之后就把尸首弄了嘛。塞石头进眼眶里，就跟以前那样。弄完丢在林子里。我们几个就跳河跑了，顺着河往南游，从南堤口水闸那边上岸了。戌狗给我抢了辆摩托车，还给我八十块钱。我就骑车到禾港去躲着了。","","②：那你怎么又回来了？","","①：这几年戌狗有钱了嘛。我回来找他做事。他现在是大老板……","","*录音在此中断。*"],"chars":829,"docx":"公共记忆-录音文件.docx"}];

    var v = (Math.random() * 255) | 0;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gc.putImageData(img, 0, 0);
}

var ctx = sun.getContext('2d');

var B = [
  [ 0,32, 8,40, 2,34,10,42],
  [48,16,56,24,50,18,58,26],
  [12,44, 4,36,14,46, 6,38],
  [60,28,52,20,62,30,54,22],
  [ 3,35,11,43, 1,33, 9,41],
  [51,19,59,27,49,17,57,25],
  [15,47, 7,39,13,45, 5,37],
  [63,31,55,23,61,29,53,21]
].map(function (r) { return r.map(function (v) { return (v + 0.5) / 64; }); });

var PX = 4;
var W = 0, H = 0, img = null;
var CX = 0, CY = 0, R = 0, HY = 0;

function smoothstep(a, b, x) {
  var t = (x - a) / (b - a);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return t * t * (3 - 2 * t);
}

function fit() {
  var w = Math.max(360, window.innerWidth);
  var h = Math.max(360, window.innerHeight);
  W = Math.ceil(w / PX); H = Math.ceil(h / PX);
  sun.width = W; sun.height = H;
  sun.style.width = w + 'px'; sun.style.height = h + 'px';
  img = ctx.createImageData(W, H);

  HY = Math.round(H * 0.74);
  R = Math.round(Math.min(W * 0.135, H * 0.235));
  CX = Math.round(W * 0.5);
  CY = HY;

  horizon.style.top = (HY * PX) + 'px';
}

function drawSun(t) {
  var d = img.data;
  var phase = t * 0.00016;
  var fadeTop = HY - R * 0.36;

  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var i = (y * W + x) << 2;
      d[i + 3] = 0;
      if (y > HY) continue;

      var dx = (x - CX) / R;
      var dy = (y - CY) / (R * 1.02);
      var dist = Math.sqrt(dx * dx + dy * dy);

      var disc = smoothstep(1.0, 0.94, dist);
      var halo = 0.09 * smoothstep(1.18, 1.0, dist);
      var v = disc > halo ? disc : halo;

      if (v > 0.004 && disc > 0) {
        v *= 0.955 + 0.045 * Math.sin(y * 0.62 + phase * 5.5);
        if (y > fadeTop) v *= 1 - 0.82 * ((y - fadeTop) / (HY - fadeTop));
        if (dist > 0.93) v *= Math.max(0, 1 - (dist - 0.93) * 8.5);
      }

      if (v > B[y & 7][x & 7]) {
        d[i] = 178; d[i + 1] = 54; d[i + 2] = 42;
        d[i + 3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

var sunTimer = null, sunT0 = Date.now();

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\*/g, '');
}
function isNote(t) { return /^\s*【/.test(t); }

function titleOf(d) {
  return d.no ? (d.no + '-' + d.sym + '-' + d.key) : d.key;
}

function rowHTML(d) {
  return d.no
    ? '<span class="no">' + esc(d.no) + '</span>-' + esc(d.sym) + '-' + esc(d.key)
    : esc(d.key);
}

function el(tag, cls, html) {
  var e = doc.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function scrollTo(host) { host.scrollTop = host.scrollHeight; }

function scrollToRound(host, r) {
  if (!host.getBoundingClientRect || !r.getBoundingClientRect) return;
  var top = r.getBoundingClientRect().top - host.getBoundingClientRect().top + host.scrollTop - 6;
  host.scrollTop = Math.max(0, top);
}
function settle(host, r) {
  if (!r) { scrollTo(host); return; }
  if (r.offsetHeight > host.clientHeight - 24) host.scrollTop = Math.max(0, r.offsetTop - 6);
  else scrollTo(host);
}

var rounds = { mem: [], doc: [] };
var folded = { mem: [], doc: [] };

function newRound(host) {
  var which = host === streamMem ? 'mem' : 'doc';
  var r = el('div', 'round');
  host.appendChild(r);
  rounds[which].push(r);
  while (rounds[which].length > 6) {
    var old = rounds[which].shift();
    old.classList.add('folded');
    folded[which].push(old);
  }
  refreshFold(which, host);
  scrollTo(host);
  return r;
}

function refreshFold(which, host) {
  var old = host.querySelector('.fold');
  if (old) old.remove();
  if (!folded[which].length) return;
  var n = folded[which].length;
  var f = el('div', 'fold', '前述内容已折叠');
  f.addEventListener('click', function () {
    folded[which].forEach(function (r) { r.classList.remove('folded'); });
    folded[which] = [];
    f.remove();
    scrollTo(host);
  });
  host.insertBefore(f, host.firstChild);
}

function echo(host, text) {
  var r = el('div', 'echo', '<span class="echo__mark">&gt;</span><span class="echo__text">' + esc(text) + '</span>');
  host.appendChild(r);
  scrollTo(host);
}
function sys(text, host) {
  host = host || streamDoc;
  var r = newRound(host);
  r.appendChild(el('div', 'sys', esc(text)));
  scrollTo(host);
}
function sysInk(text, host) {
  host = host || streamDoc;
  var r = newRound(host);
  r.appendChild(el('div', 'sys ink', esc(text)));
  scrollTo(host);
}

function hintLine(text, host) {
  host = host || streamDoc;
  var r = newRound(host);
  r.appendChild(el('div', 'hint', esc(text)));
  scrollTo(host);
}

function grantFrom(text) {
  Object.keys(KEYS).forEach(function (k) {
    if (S.known[k]) return;
    var al = ALIAS[k] || [k];
    for (var i = 0; i < al.length; i++) {
      if (text.indexOf(al[i]) >= 0) { S.known[k] = true; return; }
    }
  });
}
function isKnown(k) {
  if (S.known[k]) return true;
  if (PUBLIC_KEYS.indexOf(k) >= 0) { S.known[k] = true; return true; }
  return false;
}

function gateIndex(d) {
  for (var i = 0; i < d.paras.length; i++) {
    if (d.paras[i].indexOf('此处玩家键入存档指令') >= 0) return i;
  }
  return -1;
}

var reading = null;

function setReading(on) {
  app.classList.toggle('reading', !!on);
  try { cmd.readOnly = !!on; } catch (e) {}
}

function readItems(d, from, to) {
  var out = [];
  for (var i = from; i < to; i++) {
    var t = d.paras[i];
    if (!t || !t.trim() || isNote(t)) continue;
    if (t.indexOf('列表已解锁') >= 0) {
      out.push({ kind: 'sys', text: '列表已解锁：' + BONUS_KEY + '。', bonus: true });
      continue;
    }
    out.push({ kind: 'p', text: t.trim() });
  }
  return out;
}

function openDoc(d) {
  if (!d) return;

  var g = gateIndex(d);
  var stopAtGate = (g >= 0 && !S.done);
  var items = readItems(d, 0, stopAtGate ? g : d.paras.length);

  var r = newRound(streamMem);
  r.appendChild(el('div', 'mark', '—— ' + titleOf(d) + ' ——'));
  paneReal.classList.add('is-live');
  S.last = d.id;
  if (!S.pos[d.id]) S.pos[d.id] = 0;

  if (S.read[d.id]) {
    items.forEach(function (it) {
      if (it.kind === 'sys') {
        r.appendChild(el('div', 'sys', esc(it.text)));
        if (it.bonus) S.known[BONUS_KEY] = true;
      } else {
        r.appendChild(el('p', d.kind === 'arch' ? 'p a' : 'p', inline(it.text)));
      }
    });
    if (stopAtGate) { S.gate = true; autosave(); }
    else r.appendChild(el('div', 'mark end', '—— 结束 ——'));
    setReading(false);
    scrollToRound(streamMem, r);
    return;
  }

  reading = { d: d, r: r, items: items, i: 0, gated: stopAtGate, ending: false, cue: null };
  setReading(true);
  advanceReading();
}

function advanceReading() {
  if (!reading) return false;
  var R = reading;
  if (R.cue) { R.cue.remove(); R.cue = null; }

  if (R.i >= R.items.length) {
    reading = null;
    setReading(false);
    if (R.gated) { finishDoc(R.d); S.gate = true; autosave(); return false; }
    R.r.appendChild(el('div', 'mark end', '—— 结束 ——'));
    if (R.ending) {
      S.gate = false; S.done = true;

      var bon = DATA.filter(function (d) { return d.key === BONUS_KEY; })[0];
      if (bon) { S.known[BONUS_KEY] = true; S.down[bon.id] = true; }
      autosave();
      cmdList();
    }
    else finishDoc(R.d);
    scrollTo(streamMem);
    return false;
  }

  var it = R.items[R.i++];
  if (it.kind === 'sys') {
    R.r.appendChild(el('div', 'sys', esc(it.text)));
    if (it.bonus) S.known[BONUS_KEY] = true;
  } else {
    R.r.appendChild(el('p', R.d.kind === 'arch' ? 'p a' : 'p', inline(it.text)));
  }

  if (R.i < R.items.length || !R.gated) {
    R.cue = el('div', 'cue', '▽');
    R.r.appendChild(R.cue);
  }
  S.pos[R.d.id] = R.i;
  autosave();
  scrollTo(streamMem);
  return true;
}

function finishDoc(d) {
  S.read[d.id] = true;
  grantFrom(d.paras.join('\n'));
  if (d.key === '结局') unlockCmd(3);
  else if (KW[d.key]) unlockCmd(2);
  autosave();
  maybeReady();
}

function notFound() { sys('检索失败。人物可能散布在不同记忆碎片内。'); }

function needOf(k) { return 3; }

function search(k) {
  k = (k || '').trim();
  if (!k || !KEYS[k]) return notFound();
  if (reading) return;
  if (!unlocked(needOf(k))) { sys('该指令尚未解锁。'); return; }
  if (PUBLIC_KEYS.indexOf(k) >= 0) { sys('不在检索范围。公共记忆请从列表查看。'); return; }
  if (!isKnown(k)) { sys('人类的认知无法超出自己的记忆。'); return; }

  var hits = KEYS[k].filter(function (d) { return !S.read[d.id] && !S.down[d.id]; });
  if (!hits.length) { sys('该组记忆已全部下载。'); return; }

  var r = newRound(streamDoc);
  r.appendChild(el('div', 'mark', '—— 检索 · ' + esc(k) + ' ——'));
  hits.forEach(function (d) {
    var row = el('div', 'row item', rowHTML(d));
    row.addEventListener('click', function () {
      if (reading) return;
      if (S.down[d.id]) { sys('记忆已下载，请确认列表。'); return; }
      S.down[d.id] = true;
      row.classList.add('is-down');
      autosave();
      openById(d.id);
    });
    r.appendChild(row);
  });
  r.appendChild(el('div', 'mark end', '—— 结束 ——'));
  scrollTo(streamDoc);
}

function progressBar(done, total) {
  var CELLS = 20;
  var n = total ? Math.round(done / total * CELLS) : 0;
  if (done > 0 && n === 0) n = 1;
  if (done < total && n >= CELLS) n = CELLS - 1;
  var s = '';
  for (var i = 0; i < CELLS; i++) s += (i < n ? '▓' : '░');
  return s;
}

function listDocs() {
  var docs = [];
  Object.keys(S.known).forEach(function (k) {
    if (!KEYS[k]) return;
    KEYS[k].forEach(function (d) {
      if (d.kind === 'arch' || S.read[d.id] || S.down[d.id]) docs.push(d);
    });
  });
  docs.sort(function (a, b) {
    return (a.no || '').localeCompare(b.no || '') || a.key.localeCompare(b.key);
  });
  return docs;
}

var listFilter = '';

function cmdList() {
  var r = newRound(streamDoc);
  r.appendChild(el('div', 'mark', '—— 列表 ——'));

  var docs = listDocs();

  var ORDER = ['○', '♡', '△', '□', '※', '☆'];
  var syms = [];
  docs.forEach(function (d) {
    if (d.no && d.sym && syms.indexOf(d.sym) < 0) syms.push(d.sym);
  });
  syms.sort(function (a, b) { return ORDER.indexOf(a) - ORDER.indexOf(b); });

  var bar = el('div', 'row head flt');
  var opts = el('div', 'flt-opts');
  var body = el('div', 'list-body');
  opts.hidden = true;

  function line(d, host) {
    var row = el('div', 'row item', rowHTML(d));
    row.addEventListener('click', function () {
      if (reading) return;
      openById(d.id);
    });
    host.appendChild(row);
  }

  function paint() {
    bar.textContent = '筛选：' + (listFilter ? listFilter + '视角' : '全部');

    opts.textContent = '';
    var all = [['', '全部']];
    syms.forEach(function (s) { all.push([s, s + '视角']); });
    all.forEach(function (o) {
      var b = el('span', 'flt-opt' + (o[0] === listFilter ? ' on' : ''), esc(o[1]));
      b.addEventListener('click', function (e) {
        if (reading) return;
        e.stopPropagation();
        listFilter = o[0];
        opts.hidden = true;
        paint();
      });
      opts.appendChild(b);
    });

    body.textContent = '';
    var shown = docs.filter(function (d) {
      if (!listFilter) return true;
      return d.no && d.sym === listFilter;
    });
    shown.forEach(function (d) { line(d, body); });
    if (!shown.length) body.appendChild(el('div', 'row head', '（无）'));
  }

  bar.addEventListener('click', function () {
    if (reading || !syms.length) return;
    opts.hidden = !opts.hidden;
  });

  r.appendChild(bar);
  r.appendChild(opts);
  r.appendChild(body);
  paint();

  r.appendChild(el('div', 'mark end', '—— 结束 ——'));
  paneThink.classList.add('is-live');
  scrollTo(streamDoc);
}

function openById(id) {

function cmdTable(mark) {

  CMD_TABLE.forEach(function (c) {

function cmdThink() {
  var open = DATA.filter(function (d) { return d.key === '结局'; })[0];
  if (open && !S.read[open.id]) {
    openDoc(open);
    hintLine('鼠标点击或回车敲击以推进记忆。');
    return;
  }

  var total = DATA.filter(function (d) { return d.kind === 'mem' && isLockedDoc(d); }).length;
  var done = DATA.filter(function (d) { return d.kind === 'mem' && isLockedDoc(d) && S.read[d.id]; }).length;

  if (done < total) {
    sys('记忆尚不完整，收集进度为');
    sysInk(progressBar(done, total));
    return;
  }

  if (S.quiz === 0) { startQuiz(); return; }
  if (S.quiz <= QUIZ.length) { askNext(); return; }
  sys('全部回答完毕。');
}

var QUIZ = [
  { q: '○ 是谁？请键入全名。',  a: ['薛怜'] },
  { q: '♡ 是谁？请键入全名。',  a: ['韩彬'] },
  { q: '△ 是谁？请键入全名。',  a: ['何晓轶'] },
  { q: '□ 是谁？请键入全名。',  a: ['张昊阳'] },

function askNext() {

function answer(text) {
  var t = text.trim();

  var q = QUIZ[S.quiz - 1];

function quizDone() {
  S.quiz = 9;

  S.known[END_KEY] = true;

  var endD = DATA.filter(function (d) { return d.key === END_KEY; })[0];
  if (endD) S.down[endD.id] = true;
