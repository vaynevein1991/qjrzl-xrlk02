function snapshot() {
  return {
    v: 2,
    read: Object.keys(S.read), known: Object.keys(S.known), down: Object.keys(S.down),
    quiz: S.quiz, gate: S.gate, done: S.done, cmds: S.cmds,
    last: S.last || '', pos: S.pos || {}
  };
}
function autosave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); } catch (e) {}
}
function getSave() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function saveName() {
  var d = new Date();
  return '请键入指令-存档-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
    + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
}

function downloadSave() {
  if (typeof Blob === 'undefined' || !window.URL || !window.URL.createObjectURL) return;
  var text = JSON.stringify(snapshot(), null, 1);
  var blob = new Blob([text], { type: 'application/json' });
  var a = doc.createElement('a');
  a.href = window.URL.createObjectURL(blob);
  a.download = saveName();
  a.style.display = 'none';
  doc.body.appendChild(a);
  a.click();
  setTimeout(function () {
    try { window.URL.revokeObjectURL(a.href); } catch (e) {}
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 0);
}

function cmdSave() {
  autosave();
  try { downloadSave(); } catch (e) {}
  sys('已存档。');
  if (S.gate && !S.done) advanceEnd();
}

function applySave(s) {
  S.read = {}; S.known = {}; S.down = {};
  (s.read || []).forEach(function (k) { S.read[k] = true; });
  (s.known || []).forEach(function (k) { S.known[k] = true; });
  (s.down || []).forEach(function (k) { S.down[k] = true; });
  PUBLIC_KEYS.forEach(function (k) { S.known[k] = true; });
  S.quiz = s.quiz || 0;
  S.gate = !!s.gate;
  S.done = !!s.done;
  S.cmds = s.cmds || {};
  S.last = s.last || '';
  S.pos = s.pos || {};
  reading = null;
  setReading(false);
  streamMem.textContent = '';
  streamDoc.textContent = '';
  rounds.mem = []; rounds.doc = [];
  folded.mem = []; folded.doc = [];
}

function cmdLoad() {
  var inp = doc.getElementById('load-file');
  if (!inp) { sys('未检测到存档。'); return; }
  inp.value = '';
  try { inp.click(); } catch (e) {}
}

function bindLoad() {
  var inp = doc.getElementById('load-file');
  if (!inp) return;
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var s = null;
      try { s = JSON.parse(String(fr.result)); } catch (e) { s = null; }
      if (!s || !s.read) { sys('读取失败，请检查文件类型。'); return; }
      applySave(s);
      sys('已读档。');
      if (S.quiz > 0 && S.quiz <= QUIZ.length) askNext();
      if (S.quiz > 0 && S.quiz <= QUIZ.length) askNext();
    };
    fr.onerror = function () { sys('读取失败，请检查文件类型。'); };
    fr.readAsText(f, 'utf-8');
  });
}

function advanceEnd() {
  var d = endDoc();
  if (!d) return;
  var g = gateIndex(d);
  var r = newRound(streamMem);
  r.appendChild(el('div', 'mark', '—— ' + titleOf(d) + ' ——'));
  S.gate = false;
  reading = { d: d, r: r, items: readItems(d, g + 1, d.paras.length), i: 0, gated: false, ending: true, cue: null };
  advanceReading();
  autosave();
}

var exitArmed = false;
function cmdExit() {
  if (!exitArmed) {
    exitArmed = true;
    sys('确认退出？这将删除你的所有记忆。请再次键入指令，以防止误触。');
    return;
  }
  exitArmed = false;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  backToCover();
}

var readyFired = false;
function maybeReady() {
  if (readyFired || S.quiz > 0) return;
  var list = DATA.filter(function (d) { return d.kind === 'mem' && isLockedDoc(d); });
  var done = list.filter(function (d) { return S.read[d.id]; }).length;
  if (done < list.length) return;
  readyFired = true;
  setTimeout(function () {
    if (S.quiz > 0) return;
    sys('全部记忆已检索完毕。');
    sys('键入「思考」以提交答案。');
  }, 700);
}

var RE_SEARCH = /^检索【([^【】]+)】$/;

function parse(raw) {
  var t = raw.trim();
  if (!t) return null;

  var m = t.match(RE_SEARCH);
  if (m) return { cmd: '检索', arg: m[1] };

  if (t.indexOf('检索') === 0) return { cmd: '检索格式', arg: t };

  var byNum = { '0': '指令', '1': '思考', '2': '列表', '3': '检索', '4': '存档', '5': '读档', '6': '退出' };
  if (byNum[t]) return { cmd: byNum[t] };

  var known = { '指令': 1, '思考': 1, '列表': 1, '存档': 1, '读档': 1, '退出': 1 };
  if (known[t]) return { cmd: t };
  if (t === '指认') return { cmd: '指认' };

  return { cmd: '?', arg: t };
}

function submit() {
  var raw = cmd.value;
  if (!raw.trim()) return;
  cmd.value = '';
  updateCaret();

  var p = parse(raw);
  if (!p) return;

  if (p.cmd === '?' && S.quiz > 0 && S.quiz <= QUIZ.length) {
    echo(streamDoc, raw.trim());
    answer(raw);
    return;
  }

  if (p.cmd === '?') {

    sys(/[^\u4e00-\u9fa5【】]/.test(p.arg) ? '当前系统界面及交互指令仅支持中文。' : '文件不存在。请检查文件名称。');
    return;
  }

  echo(streamDoc, raw.trim());

  if (p.cmd === '检索格式') {
    sys('格式不符。检索须写作：检索【名称】。括号用全角，名称一字不差。');
    return;
  }

  if ((p.cmd === '列表' && !unlocked(2))) { sys('该指令尚未解锁。'); return; }

  switch (p.cmd) {
    case '指令': cmdTable(false); break;
    case '思考': cmdThink(); break;
    case '列表': cmdList(); break;
    case '检索': search(p.arg); break;
    case '存档': cmdSave(); break;
    case '读档': cmdLoad(); break;
    case '退出': cmdExit(); break;
    case '指认': startQuiz(); break;
  }
}

cmd.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();

  if (!cmd.value.trim() && reading) { advanceReading(); return; }
  submit();
});

function updateCaret() {
  mirror.textContent = cmd.value;
  caret.style.left = Math.min(mirror.offsetWidth, field.clientWidth - 10) + 'px';
}
['input', 'click', 'keyup', 'select'].forEach(function (ev) { cmd.addEventListener(ev, updateCaret); });
cmd.addEventListener('focus', function () { caret.style.display = 'block'; });
cmd.addEventListener('blur', function () { caret.style.display = 'none'; });

doc.addEventListener('click', function (e) {
  if (app.hidden) return;
  var t = e.target;
  if (t && t.closest) {
    if (t.closest('.bar')) return;
    if (t.closest('.row')) return;
    if (t.closest('.fold')) return;
  }
  if (reading) advanceReading();
  cmd.focus();
});

bindLoad();

var OP_END = 8600;

function opSceneOn(k) {
  var all = opBox.querySelectorAll('.op-scene');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('is-on');
  if (!k) return;
  var e = opBox.querySelector('.op-scene[data-op="' + k + '"]');
  if (e) e.classList.add('is-on');
}

function startOp() {
  if (reduce) { startBoot(); return; }
  var a = doc.getElementById('op-say-a');
  var b = doc.getElementById('op-say-b');
  var c = doc.getElementById('op-say-c');
  [a, b, c].forEach(function (p) { p.classList.remove('is-on'); });
  opSceneOn('a');
  opBox.hidden = false;

  setTimeout(function () { a.classList.add('is-on'); }, 900);
  setTimeout(function () { b.classList.add('is-on'); }, 3200);
  setTimeout(function () { c.classList.add('is-on'); }, 5600);
  setTimeout(function () {
    opBox.hidden = true;
    opSceneOn(null);
    startBoot();
  }, OP_END);
}

var BOOT_LINES = [
  { t: '思维系统 正在启动……', dim: false },
  { t: '载入检索模块 OK。', dim: true },
  { t: '校验访问权限 OK。', dim: true }
];

function startBoot() {
  boot.hidden = false;
  requestAnimationFrame(function () { boot.classList.add('on'); });
  var host = doc.getElementById('boot-lines');
  host.textContent = '';
  BOOT_LINES.forEach(function (b, i) {
    setTimeout(function () {
      var p = doc.createElement('p');
      if (b.dim) p.className = 'dim';
      p.textContent = b.t;
      host.appendChild(p);
      requestAnimationFrame(function () { p.classList.add('on'); });
    }, i * ms(140));
  });
  setTimeout(showApp, ms(140 * BOOT_LINES.length + 620));
}

function showApp() {
  boot.classList.remove('on');
  setTimeout(function () {
    boot.hidden = true;
    app.hidden = false;
    requestAnimationFrame(function () { app.classList.add('on'); });
    openApp();
  }, ms(520));
}

function openApp() {
  var s = getSave();
  if (s) applySave(s);

  var toList = ms(160), toReady = ms(240);

  setTimeout(function () {
    cmdTable(false);
    paneReal.classList.add('is-live');
    setTimeout(function () {
      sysInk('就绪。请键入指令。');
      updateCaret();
      cmd.focus();
      restoreLast();
    }, toReady);
  }, toList);
}

function restoreLast() {
  var d = S.last && BY_ID[S.last];
  if (!d) return;
  var n = (S.pos && S.pos[S.last]) || 0;
  if (n <= 0) return;
  openDoc(d);
  for (var i = 1; i < n; i++) advanceReading();
  if (S.quiz > 0 && S.quiz <= QUIZ.length) askNext();
}

function enter() {
  if (entered) return;
  entered = true;
  stage.classList.add('glitch');
  setTimeout(function () {
    stage.classList.remove('glitch');
    [stage, btn, horizon, sun].forEach(function (e) { e.classList.add('down'); });
    setTimeout(function () {
      stopSun();
      cover.hidden = true;
      doc.body.classList.remove('cover-mode');
      startOp();
    }, ms(520));
  }, ms(520));
}

var entered = false;
btn.addEventListener('click', enter, { once: true });
cover.addEventListener('click', function (e) { if (e.target === cover) enter(); });
doc.addEventListener('keydown', function (e) {
  if (!cover.hidden && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(); }
});

function backToCover() {
  app.classList.remove('on');
  setTimeout(function () {
    app.hidden = true;
    streamMem.textContent = '';
    streamDoc.textContent = '';
    rounds.mem = []; rounds.doc = [];
    folded.mem = []; folded.doc = [];
    paneReal.classList.remove('is-live');
    paneThink.classList.remove('is-live');
    S.read = {}; S.known = {}; S.down = {};
    PUBLIC_KEYS.forEach(function (k) { S.known[k] = true; });
    S.quiz = 0; S.gate = false; S.done = false; readyFired = false;
    S.cmds = {}; S.last = ''; S.pos = {};
    entered = false;
    cover.hidden = false;
    doc.body.classList.add('cover-mode');
    [stage, btn, horizon, sun].forEach(function (e) { e.classList.remove('down'); });
    sun.classList.remove('on');
    startSun();
    stage.classList.add('on');
    btn.classList.add('on');
  }, ms(520));
}

var SESSION_KEY = 'xrlk.session';
var sameSession = false;
try { sameSession = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) {}
try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}

var isDebug = location.hash.indexOf('#auto') === 0 || location.hash === '#live';
if (sameSession && !isDebug && getSave()) {
  cover.hidden = true;
  opBox.hidden = true;
  boot.hidden = true;
  doc.body.classList.remove('cover-mode');
  stopSun();
  app.hidden = false;
  app.classList.add('on');
  openApp();
}

var autoRun = null;
if (location.hash === '#live') setTimeout(enter, 120);
if (location.hash.indexOf('#auto') === 0 && location.hash.indexOf('click') > 0) {
  setTimeout(function () {
    var rows = doc.querySelectorAll('.row.item');
    if (rows.length) rows[0].click();
    while (advanceReading()) {}
    var am = location.hash.match(/after=([^&]+)/);
    if (am) setTimeout(function () { cmd.value = decodeURIComponent(am[1]); submit(); }, 400);
    if (location.hash.indexOf('twice') > 0) setTimeout(function () {
      var rs = doc.querySelectorAll('.row.item');
      if (rs.length) rs[0].click();
    }, 900);
    if (location.hash.indexOf('lastone') > 0) setTimeout(function () {
      var rs = doc.querySelectorAll('.row.item');
      if (rs.length) rs[rs.length - 1].click();
    }, 1100);
    if (location.hash.indexOf('flt') > 0) setTimeout(function () {
      var b = doc.querySelector('.row.flt');
      if (b) b.click();
    }, 1400);
    var foi = location.hash.match(/opt=(\d+)/);
    if (foi) setTimeout(function () {
      var os = doc.querySelectorAll('.flt-opt');
      var k = Number(foi[1]);
      if (os[k]) os[k].click();
    }, 1800);
    if (location.hash.indexOf('deep') > 0) {
      setTimeout(function () { cmd.value = '检索【母亲】'; submit(); }, 700);
      setTimeout(function () { cmd.value = '列表'; submit(); }, 1400);
    }
  }, 4200);
}
if (location.hash.indexOf('#auto') === 0) {
  var _m = location.hash.match(/run=([^&]+)/);
  if (_m) {
    try { autoRun = decodeURIComponent(_m[1]).split('|'); } catch (e) { autoRun = null; }
  }
  setTimeout(function () {
    cover.hidden = true;
    doc.body.classList.remove('cover-mode');
    stopSun();
    startBoot();
    var t = setInterval(function () {
      if (!app.hidden && app.classList.contains('on')) {
        clearInterval(t);
        if (autoRun) {
          setTimeout(function () {
            autoRun.forEach(function (c) {
              cmd.value = c; submit();
              if (location.hash.indexOf('drain') > 0) { while (advanceReading()) {} }
            });
            autoRun = null;
            var pm = location.hash.match(/page=(\d+)/);
            if (pm) {
              var n = Number(pm[1]);
              for (var i = 0; i < n; i++) advanceReading();
            }
            if (location.hash.indexOf('reload') > 0) {
              setTimeout(function () { location.hash = ''; location.reload(); }, 900);
            }
          }, 80);
        }
      }
    }, 60);
  }, 80);
}
</script>
</body>
</html>
